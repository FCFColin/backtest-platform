                  minLength: 1
                  maxLength: 255
                body:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum:
                    - display
                    - maintenance
                    - other
                severity:
                  type: string
                  enum:
                    - debug
                    - info
                    - warning
                    - error
              required:
                - title
                - body
      responses:
