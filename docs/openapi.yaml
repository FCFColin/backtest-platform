openapi: 3.0.3
info:
  title: 回测平台 API
  version: 1.0.0
  description: |-
    回测平台提供组合回测、资产分析、蒙特卡洛模拟、组合优化、有效前沿、战术分配、信号分析、PCA、LETF、目标优化等量化投资工具。

    ## 认证
    - 计算端点必须携带 JWT Bearer Token（Authorization: Bearer <accessToken>）
    - 管理端点需 JWT + RBAC 权限
    - 兼容模式：x-api-key 请求头（过渡用，不推荐生产长期依赖）
    - 认证流程：POST /auth/login/password -> accessToken + refreshToken
    - 健康检查 /health 与 /metrics 无需用户 JWT

    ## 速率限制
    - 普通 API：100 次/15 分钟/IP
    - 计算密集型 API（backtest、backtest-optimizer）：10 次/分钟/IP

    ## 错误格式
    - 所有错误使用 RFC 7807 Problem Details：{ success: false, error: { type, title, status, code, detail } }
    - 数据服务降级响应包含 degraded: true + degradedWarning（仅数据端点；引擎端点 fail-closed 返回 503 + Retry-After，见 ADR-031）
servers:
  - url: http://localhost:15001/api/v1
    description: 本地开发环境
tags:
  - name: auth
  - name: backtest
  - name: backtest-optimizer
  - name: data
  - name: data-manage
  - name: admin
  - name: saas-keys
  - name: saas-portfolios
  - name: saas-configs
  - name: saas-runs
  - name: saas-orgs
  - name: saas-billing
  - name: saas-jobs
  - name: tactical
  - name: tactical-grid
  - name: signal
  - name: pca
  - name: letf
  - name: goal-optimizer
  - name: calculators
  - name: factor-regression
  - name: health
  - name: webhooks
  - name: announcements
  - name: tactical-config
  - name: data-custom
  - name: audit-logs
  - name: rbac
  - name: errors
  - name: feature-flags
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 访问令牌，通过 /auth/login 获取。
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 按组织 API Key（过渡兼容，不推荐生产长期依赖）。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 幂等性 Key，防止管理端点写操作重复执行（1 小时内相同 Key 返回缓存结果）。
    P1:
      schema:
        type: string
      required: true
      name: id
      in: path
    P2:
      schema:
        type: string
      required: true
      name: userId
      in: path
  schemas:
    ProblemDetail:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            type:
              type: string
              format: uri
            title:
              type: string
            status:
              type: integer
            code:
              type: string
            detail:
              type: string
            instance:
              type: string
          required:
            - type
            - title
            - status
            - code
        degraded:
          type: boolean
        degradedWarning:
          type: string
      required:
        - success
        - error
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          nullable: true
      required:
        - success
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          nullable: true
        degraded:
          type: boolean
        degradedWarning:
          type: string
      required:
        - success
    BacktestJobAccepted:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            jobId:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - queued
            statusUrl:
              type: string
          required:
            - jobId
            - status
            - statusUrl
      required:
        - success
        - data
  responses:
    R1:
      description: 请求参数错误
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R2:
      description: 未认证或令牌失效
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R3:
      description: 校验失败
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R4:
      description: 请求过于频繁
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R5:
      description: 服务器内部错误
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R6:
      description: 成功
      content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
    R7:
      description: 冲突
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R8:
      description: 无权限
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R9:
      description: 资源不存在
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
    R10:
      description: 服务不可用（降级或引擎不可用）
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetail" } } }
paths:
  /auth/login/password:
    post:
      summary: 用户名密码登录
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - username
                - password
      responses:
        "200":
          description: 返回 accessToken/refreshToken
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "422": { $ref: "#/components/responses/R3" }
        "429": { $ref: "#/components/responses/R4" }
        "500": { $ref: "#/components/responses/R5" }
  /auth/register:
    post:
      summary: 注册新用户
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 50
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 6
                  maxLength: 256
                orgName:
                  type: string
                  maxLength: 100
              required:
                - username
                - email
                - password
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "409": { $ref: "#/components/responses/R7" }
        "422": { $ref: "#/components/responses/R3" }
        "429": { $ref: "#/components/responses/R4" }
        "500": { $ref: "#/components/responses/R5" }
  /auth/refresh:
    post:
      summary: 刷新访问令牌
      tags:
        - auth
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "500": { $ref: "#/components/responses/R5" }
  /auth/logout:
    delete:
      summary: 登出（吊销刷新令牌）
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
  /auth/me:
    get:
      summary: 查询当前用户身份
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
    delete:
      summary: 注销账户
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "500": { $ref: "#/components/responses/R5" }
  /auth/orgs:
    get:
      summary: 查询可切换组织列表
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
  /auth/switch-org:
    post:
      summary: 切换当前组织
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
  /auth/verify-email:
    post:
      summary: 邮箱验证
      tags:
        - auth
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "404": { $ref: "#/components/responses/R9" }
  /auth/resend-verification:
    post:
      summary: 重发验证邮件
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "429": { $ref: "#/components/responses/R4" }
  /keys:
    post:
      summary: 创建组织 API Key
      tags:
        - saas-keys
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
              required:
                - name
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "422": { $ref: "#/components/responses/R3" }
    get:
      summary: 列出组织 API Key
      tags:
        - saas-keys
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
  /keys/{id}:
    delete:
      summary: 吊销组织 API Key
      tags:
        - saas-keys
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
  /portfolios:
    get:
      summary: 列出已保存组合
      tags:
        - saas-portfolios
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
    post:
      summary: 保存组合
      tags:
        - saas-portfolios
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                assets:
                  type: array
                  items:
                    type: object
                    properties:
                      ticker:
                        type: string
                        minLength: 1
                        maxLength: 32
                      weight:
                        type: number
                        minimum: 0
                    required:
                      - ticker
                      - weight
                  minItems: 1
                  maxItems: 200
                rebalanceFrequency:
                  type: string
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - quarterly
                    - annual
                    - none
                    - threshold
              required:
                - name
                - assets
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "422": { $ref: "#/components/responses/R3" }
  /portfolios/{id}:
    get:
      summary: 查询组合详情
      tags:
        - saas-portfolios
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
    put:
      summary: 更新组合
      tags:
        - saas-portfolios
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                assets:
                  type: array
                  items:
                    type: object
                    properties:
                      ticker:
                        type: string
                        minLength: 1
                        maxLength: 32
                      weight:
                        type: number
                        minimum: 0
                    required:
                      - ticker
                      - weight
                  minItems: 1
                  maxItems: 200
                rebalanceFrequency:
                  type: string
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - quarterly
                    - annual
                    - none
                    - threshold
              required:
                - name
                - assets
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
        "422": { $ref: "#/components/responses/R3" }
    delete:
      summary: 删除组合
      tags:
        - saas-portfolios
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
  /configs:
    get:
      summary: 列出命名配置
      tags:
        - saas-configs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
    post:
      summary: 保存命名配置
      tags:
        - saas-configs
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                config:
                  type: object
                  additionalProperties:
                    nullable: true
              required:
                - name
                - config
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "422": { $ref: "#/components/responses/R3" }
  /configs/{id}:
    get:
      summary: 查询配置详情
      tags:
        - saas-configs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
    put:
      summary: 更新命名配置
      tags:
        - saas-configs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                config:
                  type: object
                  additionalProperties:
                    nullable: true
              required:
                - name
                - config
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
        "422": { $ref: "#/components/responses/R3" }
    delete:
      summary: 删除命名配置
      tags:
        - saas-configs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
  /runs:
    get:
      summary: 列出回测历史
      tags:
        - saas-runs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
    post:
      summary: 保存回测历史
      tags:
        - saas-runs
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                request:
                  type: object
                  additionalProperties:
                    nullable: true
                result:
                  nullable: true
                status:
                  type: string
                  enum:
                    - pending
                    - running
                    - completed
                    - failed
              required:
                - request
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "400": { $ref: "#/components/responses/R1" }
        "401": { $ref: "#/components/responses/R2" }
        "422": { $ref: "#/components/responses/R3" }
  /runs/{id}:
    get:
      summary: 查询回测历史详情
      tags:
        - saas-runs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
    delete:
      summary: 删除回测历史
      tags:
        - saas-runs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
  /orgs/current:
    get:
      summary: 查询当前组织
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
    patch:
      summary: 更新当前组织信息
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
        "422": { $ref: "#/components/responses/R3" }
  /orgs/members:
    get:
      summary: 列出组织成员
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
  /orgs/members/{userId}:
    patch:
      summary: 更新成员角色
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P2"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
        "404": { $ref: "#/components/responses/R9" }
    delete:
      summary: 移除成员
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P2"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
        "404": { $ref: "#/components/responses/R9" }
  /orgs/invitations:
    get:
      summary: 列出组织邀请
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
    post:
      summary: 创建组织邀请
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
        "422": { $ref: "#/components/responses/R3" }
  /orgs/invitations/accept:
    post:
      summary: 接受组织邀请
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "404": { $ref: "#/components/responses/R9" }
        "409": { $ref: "#/components/responses/R7" }
  /orgs/invitations/{id}:
    delete:
      summary: 撤销组织邀请
      tags:
        - saas-orgs
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/P1"
      responses:
        "200": { $ref: "#/components/responses/R6" }
        "401": { $ref: "#/components/responses/R2" }
        "403": { $ref: "#/components/responses/R8" }
        "404": { $ref: "#/components/responses/R9" }
  /billing/subscription:
    get:
      summary: 查询当前订阅
      tags:
        - saas-billing
      security:
        - BearerAuth: []
      responses:
