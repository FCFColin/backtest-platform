packages:
  - 'packages/*'
allowBuilds:
  '@scarf/scarf': false # 遥测 postinstall 不执行（供应链安全）
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
overrides:
  typescript: ~5.8.3
  vitest: ^3.2.6
  vite: ^6.3.5
  '@testing-library/react': ^16.3.2
  minimatch@10.1.2: 10.2.6 # CVE 修复（sonarjs 钉 10.1.2；bare 覆盖会误伤 minimatch@3/eslint）
  brace-expansion@^1.1.7: 1.1.18 # CVE 修复（v1 链：minimatch@3/glob 用）
  fast-uri@^3.0.1: 3.1.5 # CVE 修复（ajv 解析）
  shell-quote@1.8.4: 1.9.0 # CVE 修复（shell-quote 1.8.4 链；registry 无 1.8.5）
  postcss: 8.5.23 # CVE 修复（全部 postcss v8 链）
  undici@^7.25.0: 7.29.0 # CVE 修复（jsdom 链）
  undici@^8.5.0: 8.9.0 # CVE 修复（testcontainers 链）
  brace-expansion@^2: 2.1.4 # CVE 修复（DoS，>=2.0.0 <2.1.4 均受影响）
  brace-expansion@^5: 5.0.9 # CVE 修复（DoS，>=4.0.0 <5.0.9 均受影响）
  protobufjs: 7.6.5 # CVE 修复（proto 解析 DoS，<=7.6.4 受影响）
  ip-address: 10.3.1 # CVE 修复（IPv4/CIDR 解析，<=10.3.0 受影响）
  body-parser: 1.20.6 # CVE 修复（无效 limit DoS，<1.20.6 受影响）
  js-yaml@^3: ^3.15.1 # CVE 修复（CVE-2026-59870，v3 链 <3.15.1 受影响）
  js-yaml@^4: ^4.3.1 # CVE 修复（CVE-2026-59870，v4 链 <4.3.1 受影响）
