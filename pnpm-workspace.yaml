packages:
  - 'packages/*'
allowBuilds:
  '@scarf/scarf': false # 遥测 postinstall 不执行（供应链安全）
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true

# P3-4: 统一关键依赖版本，避免子包声明不一致导致构建产物差异
pnpm:
  overrides:
    typescript: ~5.8.3
    vitest: ^3.2.6
    vite: ^6.3.5
    '@testing-library/react': ^16.3.2
    happy-dom: ^20.0.0
    minimatch: 10.2.5
