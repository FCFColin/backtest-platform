packages:
  - 'packages/*'
allowBuilds:
  '@openapitools/openapi-generator-cli': set this to true or false
  '@scarf/scarf': set this to true or false
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: set this to true or false
  ssh2: true

# P3-4: 统一关键依赖版本，避免子包声明不一致导致构建产物差异
pnpm:
  overrides:
    typescript: ~5.8.3
    vitest: ^3.2.6
    vite: ^6.3.5
    '@testing-library/react': ^16.3.2
    happy-dom: ^20.0.0
    minimatch: 10.2.5
