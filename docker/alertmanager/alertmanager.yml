# AlertManager config — P0 critical → feishu+dingtalk, P1 warning → feishu, P2 info → feishu.
# Inhibition: P0 suppresses same-scope P1 to avoid alert storms.
# envsubst renders ${FEISHU_WEBHOOK}/${DINGTALK_WEBHOOK} at container startup.

global:
  resolve_timeout: 5m

inhibit_rules:
  # critical suppresses same-service warning
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['service']

  # GoEngineDown → suppress error rate alerts
  - source_matchers:
      - alertname = "GoEngineDown"
    target_matchers:
      - alertname =~ "HighErrorRate"
    equal: ['service']

  # PostgresDown → suppress pool/replication alerts
  - source_matchers:
      - alertname = "PostgresDown"
    target_matchers:
      - alertname =~ "ReplicationLag"
    equal: ['service']

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 0s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'feishu-info'

  routes:
    # P0: critical → feishu + dingtalk
    - matchers:
        - severity = "critical"
      receiver: 'p0-feishu-dingtalk'
      group_wait: 0s
      repeat_interval: 30m
      continue: false

    # P1: warning → feishu
    - matchers:
        - severity = "warning"
      receiver: 'p1-feishu'
      group_wait: 30s
      repeat_interval: 1h
      continue: false

    # P2: info → feishu
    - matchers:
        - severity = "info"
      receiver: 'feishu-info'
      group_wait: 5m
      repeat_interval: 4h
      continue: false

receivers:
  # P0: feishu + dingtalk dual channel
  - name: 'p0-feishu-dingtalk'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK}'
        send_resolved: true
        max_alerts: 0
      - url: '${DINGTALK_WEBHOOK}'
        send_resolved: true
        max_alerts: 0

  # P1: feishu only
  - name: 'p1-feishu'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK}'
        send_resolved: true
        max_alerts: 0

  # P2 / default: feishu only
  - name: 'feishu-info'
    webhook_configs:
      - url: '${FEISHU_WEBHOOK}'
        send_resolved: true
        max_alerts: 0
