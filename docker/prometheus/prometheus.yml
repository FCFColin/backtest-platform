# Local docker-compose monitoring stack — scrape targets match docker-compose.yml services.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'backtest-platform-local'
    environment: 'dev'

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:5001']
        labels:
          service: 'api'

  - job_name: 'engine-go'
    metrics_path: /metrics
    static_configs:
      - targets: ['engine-go:5004']
        labels:
          service: 'engine-go'

  - job_name: 'data-fetcher'
    metrics_path: /metrics
    static_configs:
      - targets: ['data-fetcher:5003']
        labels:
          service: 'data-fetcher'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  - job_name: 'apisix'
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix:9091']
        labels:
          service: 'apisix'
