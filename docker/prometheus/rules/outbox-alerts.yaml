# Outbox table monitoring — event backlog, staleness, and table growth alerts.
groups:
  - name: outbox
    rules:
      - alert: OutboxUnprocessedHigh
        expr: outbox_unprocessed_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox unprocessed events count is high'
          description: '{{ $value }} unprocessed outbox events. Events may be stuck (handler failure or DB issue).'

      - alert: OutboxOldestUnprocessedStale
        expr: outbox_oldest_unprocessed_age_seconds > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Oldest unprocessed outbox event is stale'
          description: 'Oldest unprocessed event is {{ $value }}s old (>10min). Check OutboxPublisher listener and compensation scanner.'

      - alert: OutboxTableGrowing
        expr: outbox_total_rows > 50000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox table has too many rows'
          description: '{{ $value }} total rows in outbox table. Cleanup may not be running or retention period too long.'
