# Business metric alerts — 7 rules covering core business path anomalies.
groups:
  - name: business
    rules:
      - alert: BacktestHighErrorRate
        expr: |
          rate(backtest_requests_total{status="error"}[5m])
          / rate(backtest_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Backtest error rate > 10%'
          description: 'Error rate is {{ $value | humanizePercentage }}. Check engine-go health and DB connectivity.'

      - alert: EngineCircuitBreakerOpen
        expr: engine_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Engine circuit breaker is OPEN'
          description: 'Go engine circuit breaker has been open for >1min. All compute endpoints returning 503.'

      - alert: BacktestQueueBacklog
        expr: engine_queue_depth > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Backtest queue depth > 50'
          description: '{{ $value }} jobs waiting. Check worker capacity and engine-go response time.'

      - alert: QuotaApproachingLimit
        expr: quota_usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Quota usage > 90%'
          description: 'Organization is approaching plan quota limit. Consider upgrade notification.'

      - alert: PgPoolExhausted
        expr: pg_pool_waiting_count > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL connection pool waiting count > 10'
          description: 'Pool exhaustion detected. Check for long-running queries or increase pool size.'

      - alert: RedisUnavailable
        expr: rate_limiter_redis_unavailable_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis unavailable - rate limiter fail-closed'
          description: 'Redis is unavailable, all rate limiters are returning 503. Check Redis Sentinel health.'

      - alert: TlsCertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry{job="blackbox"} < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate expiring within 7 days'
          description: 'Certificate will expire in {{ $value | humanizeDuration }}. Renew before expiry.'
