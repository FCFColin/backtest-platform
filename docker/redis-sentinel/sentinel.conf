# =============================================================================
# Redis Sentinel 配置（本地 docker-compose 验证拓扑，ADR-045 P0-05 T2）
# =============================================================================
#
# 企业理由：k8s/redis.yaml 的 ConfigMap 提供 K8s 环境的 Sentinel 配置；
# 本文件是其 docker-compose 等价物，供本地验证故障转移——停止 redis-master，
# 观察 3 个 Sentinel 在 < 30s 内选举 redis-replica-1 或 redis-replica-2 为新主。
#
# 与 k8s/redis.yaml 的差异：
#   - master 主机名用 docker-compose 服务名 `redis-master`（k8s 用 `redis-0.redis`）
#   - 其余参数与 k8s ConfigMap 完全一致，保证行为等价
#
# 挂载方式：docker-compose.yml 以只读（:ro）挂载此文件到 /etc/redis/sentinel.conf。
# Sentinel 运行时会在内存中维护故障转移状态；dir=/data 指向可写 docker volume
# （redis-sentinel-N-data），用于持久化运行时数据。只读挂载意味着 Sentinel
# 无法重写本配置文件（重启后回到初始 master 指向），但本地验证场景可接受——
# 故障转移在内存中即时生效，无需跨重启持久化。
# =============================================================================

port 26379
dir /data

# 监控 mymaster = redis-master:6379，quorum=2（3 节点中 2 个同意即故障转移）
sentinel monitor mymaster redis-master 6379 2

# 5s 无响应判定主观下线（SDOWN），足够快感知故障又不误判
sentinel down-after-milliseconds mymaster 5000

# 30s 故障转移超时（ADR-045 Checklist：< 30s 切换）
sentinel failover-timeout mymaster 30000

# 每次故障转移只让 1 个从节点同步新主，避免全量同步雪崩
sentinel parallel-syncs mymaster 1

# 禁止运行时通过 SENTINEL SET 修改脚本路径（安全加固）
sentinel deny-scripts-reconfig yes
