# =============================================================================
# P1-01: 默认拒绝所有入站+出站流量
# =============================================================================
# 企业理由：零信任网络模型——默认拒绝所有流量，后续策略按最小权限逐条放行。
# 任何未显式允许的连接都会被拒绝，防止横向移动攻击。
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: backtest-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
