# =============================================================================
# P1-01: 内部服务出站放行
# =============================================================================
# pgbouncer → postgres:5432
# redis-sentinel → redis:6379
# engine-go → data-fetcher:5003
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-egress
  namespace: backtest-platform
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-sentinel-egress
  namespace: backtest-platform
spec:
  podSelector:
    matchLabels:
      app: redis-sentinel
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-engine-go-egress
  namespace: backtest-platform
spec:
  podSelector:
    matchLabels:
      app: engine-go
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: data-fetcher
      ports:
        - protocol: TCP
          port: 5003
