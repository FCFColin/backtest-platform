# PostgreSQL StatefulSet (ADR-007) — dev: 1 replica, 1Gi; prod: 3 replicas, 10Gi+ SSD
# StatefulSet required for: stable PVC binding, stable DNS (postgres-0), ordered rolling updates
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: backtest-platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: backtest-platform
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://backtest:<REPLACE_ME>@postgres:5432/backtest'
  POSTGRES_USER: 'backtest'
  POSTGRES_PASSWORD: '<REPLACE_ME>'
  POSTGRES_DB: 'backtest'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: backtest-platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: backtest-platform
data:
  01-init.sql: |
    GRANT ALL PRIVILEGES ON DATABASE backtest TO backtest;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: backtest-platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: backtest-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: backtest-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests: { memory: '128Mi', cpu: '0.25' }
            limits: { memory: '256Mi', cpu: '0.5' }
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_INITDB_ARGS
              value: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
          livenessProbe:
            exec:
              command: [pg_isready, -U, backtest, -d, backtest]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [pg_isready, -U, backtest, -d, backtest]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: backtest-platform
  labels:
    app: postgres
    app.kubernetes.io/part-of: backtest-platform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
