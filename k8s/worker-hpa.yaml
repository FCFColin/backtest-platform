# 企业理由：Worker 副本数固定 1，回测高峰期任务积压时无法自动扩容。
# BullMQ 支持多副本并发（通过 WORKER_CONCURRENCY 控制单实例并发数），
# HPA 基于 CPU 自动扩缩确保异步任务处理能力弹性扩展。
# 单副本也是 SPOF——Pod 重启期间正在处理的任务需等待 BullMQ 重试超时后重新分配。
# 权衡：多副本需确保任务幂等性（已由 jobIdempotency.ts Redis NX+EX 守卫，T-37/ADR-024）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: backtest-platform
  labels:
    app.kubernetes.io/part-of: backtest-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60