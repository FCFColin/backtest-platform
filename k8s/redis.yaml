apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-data
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  labels:
    app: redis
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e
    ORDINAL="${HOSTNAME##*-}"
    AUTH_ARGS=""
    cp /sentinel-config/sentinel.conf /data/sentinel.conf
    if [ -n "$REDIS_PASSWORD" ]; then
      AUTH_ARGS="--requirepass $REDIS_PASSWORD --masterauth $REDIS_PASSWORD"
      echo "sentinel auth-pass mymaster $REDIS_PASSWORD" >> /data/sentinel.conf
    fi
    # 每 Pod 同时运行 Sentinel（监控 redis-0.redis），3 节点满足 quorum=2
    redis-server --port 26379 --sentinel /data/sentinel.conf &
    if [ "$ORDINAL" = "0" ]; then
      exec redis-server --port 6379 --appendonly yes --min-slaves-to-write 1 --min-slaves-max-lag 10 --save 60 1000 $AUTH_ARGS
    else
      exec redis-server --port 6379 --appendonly yes --replicaof redis-0.redis 6379 --replica-read-only yes $AUTH_ARGS
    fi
  sentinel.conf: |
    port 26379
    dir /data
    sentinel monitor mymaster redis-0.redis 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 30000
    sentinel parallel-syncs mymaster 1
    sentinel deny-scripts-reconfig yes
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      initContainers:
        - name: init-script
          image: redis:7.4-alpine
          command:
            [
              'sh',
              '-c',
              'cp /config/entrypoint.sh /scripts/entrypoint.sh && chmod +x /scripts/entrypoint.sh',
            ]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 26379
              name: sentinel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: auth-tokens, key: REDIS_PASSWORD } }
          command: ['/scripts/entrypoint.sh']
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
            - name: sentinel-config
              mountPath: /sentinel-config
          readinessProbe:
            exec: { command: [sh, -c, 'redis-cli -a $REDIS_PASSWORD ping | grep PONG'] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: [sh, -c, 'redis-cli -a $REDIS_PASSWORD ping | grep PONG'] }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: redis-sentinel-config
        - name: scripts
          emptyDir: {}
        - name: sentinel-config
          configMap:
            name: redis-sentinel-config
            items:
              - key: sentinel.conf
                path: sentinel.conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: redis-data
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
