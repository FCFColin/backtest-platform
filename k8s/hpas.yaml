# Worker: BullMQ 天然防并发重复，多副本需任务幂等性（ADR-024 Redis NX+EX 守卫）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      {
        stabilizationWindowSeconds: 300,
        policies: [{ type: Percent, value: 10, periodSeconds: 60 }],
      }
    scaleUp:
      {
        stabilizationWindowSeconds: 60,
        policies: [{ type: Percent, value: 100, periodSeconds: 60 }],
      }
