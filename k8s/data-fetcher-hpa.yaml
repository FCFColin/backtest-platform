# 企业理由：数据服务在市场数据批量获取高峰（如开盘前批量拉取）时需要自动扩容。
# data-fetcher 固定 2 副本无法应对峰值，HPA 基于 CPU 自动扩缩确保数据请求不超时。
# 权衡：HPA 依赖 Metrics Server，冷启动扩容有延迟（约 30-60s）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-fetcher-hpa
  namespace: backtest-platform
  labels:
    app.kubernetes.io/part-of: backtest-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-fetcher
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60