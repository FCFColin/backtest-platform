apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-fetcher
  labels:
    app: data-fetcher
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-fetcher
  template:
    metadata:
      labels:
        app: data-fetcher
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: data-fetcher
          image: backtest-platform/data-fetcher:v1.0.0
          ports:
            - containerPort: 5003
          resources:
            requests: { memory: '256Mi', cpu: '0.5' }
            limits: { memory: '512Mi', cpu: '1' }
          startupProbe:
            httpGet: { path: /api/data/health, port: 5003 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/data/health, port: 5003 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: 5003 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
