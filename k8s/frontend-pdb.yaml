# 企业理由：frontend 副本数 2，无 PDB 时节点维护（kubectl drain）可能同时驱逐
# 两个 Pod 导致前端完全不可用。PDB minAvailable:1 确保至少 1 个 Pod 始终可用。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: backtest-platform
  labels:
    app.kubernetes.io/part-of: backtest-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend