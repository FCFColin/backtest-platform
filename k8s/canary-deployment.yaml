# Canary Deployment 配置（基于 ADR-036）
#
# 渐进式灰度发布：新版本先以 10% 流量灰度，观察错误率/延迟指标，
# 异常自动回滚，正常则逐步提升至 100%。
#
# 依赖：Istio (VirtualService + DestinationRule) 实现按权重流量切分。
# 回滚机制：Prometheus 指标异常 → ArgoCD 自动回滚到 stable。
#
# 参考：ADR-036（Stripe billing + canary deployment）

---
# Canary deployment：新版本 Pod（10% 流量起步）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  namespace: backtest-platform
  labels:
    app: api
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      track: canary
  template:
    metadata:
      labels:
        app: api
        track: canary
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: registry.example.com/backtest-api:canary
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
# Istio VirtualService：按权重切分流量（canary 10%，stable 90%）
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-canary
  namespace: backtest-platform
spec:
  hosts:
    - api
  http:
    - match:
        - headers:
            x-canary:
              exact: 'true'
      route:
        - destination:
            host: api
            subset: canary
          weight: 100
    - route:
        - destination:
            host: api
            subset: stable
          weight: 90
        - destination:
            host: api
            subset: canary
          weight: 10
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: '5xx,reset,connect-refused'
---
# DestinationRule：定义 stable/canary 子集
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-canary
  namespace: backtest-platform
spec:
  host: api
  subsets:
    - name: stable
      labels:
        track: stable
    - name: canary
      labels:
        track: canary
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
