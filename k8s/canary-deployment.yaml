apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  labels:
    app: api
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      track: canary
  template:
    metadata:
      labels:
        app: api
        track: canary
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: backtest-platform/api:v1.0.0
          ports:
            - containerPort: 5001
          envFrom:
            - { configMapRef: { name: api-config } }
            - { secretRef: { name: api-secrets } }
          readinessProbe:
            httpGet: { path: /api/ready, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 5001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-canary
spec:
  hosts: [api]
  http:
    - match:
        - headers:
            x-canary:
              exact: 'true'
      route:
        - destination: { host: api, subset: canary }
          weight: 100
    - route:
        - destination: { host: api, subset: stable }
          weight: 90
        - destination: { host: api, subset: canary }
          weight: 10
      retries: { attempts: 3, perTryTimeout: 10s, retryOn: '5xx,reset,connect-refused' }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-canary
spec:
  host: api
  subsets:
    - name: stable
      labels: { track: stable }
    - name: canary
      labels: { track: canary }
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 50 }
      http: { http2MaxRequests: 100, maxRequestsPerConnection: 10 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
