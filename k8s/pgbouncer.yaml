apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
data:
  pgbouncer.ini: |
    [databases]
    backtest = host=postgres port=5432 dbname=backtest

    [pgbouncer]
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 25
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_idle_timeout = 300
    server_lifetime = 3600
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    log_connections = 0
    log_disconnections = 0
    stats_period = 60
    admin_users = backtest
---
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-userlist
type: Opaque
stringData:
  userlist.txt: |
    "backtest" "SCRAM-SHA-256$4096:placeholder=="
    "backtest_app" "SCRAM-SHA-256$4096:placeholder=="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.23.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 5432
          env:
            - name: DB_USER
              value: backtest
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
            - name: userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
          resources:
            requests: { memory: 32Mi, cpu: 0.1 }
            limits: { memory: 64Mi, cpu: 0.25 }
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: userlist
          secret:
            secretName: pgbouncer-userlist
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
