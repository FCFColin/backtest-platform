apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backtest-platform-production
resources:
  - ../../base
replicas:
  - name: api
    count: 3
  - name: engine-go
    count: 2
  - name: frontend
    count: 2
  - name: data-fetcher
    count: 2
  - name: backtest-worker
    count: 1
patches:
  - target: { kind: Deployment, name: backtest-worker }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { memory: 1Gi, cpu: 1 }
          limits: { memory: 2Gi, cpu: 2 }
patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: engine-go }
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: engine-go } } }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector: { matchLabels: { app: engine-go } }
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: api }
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: api } } }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector: { matchLabels: { app: api } }
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: data-fetcher }
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app: data-fetcher } } }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector: { matchLabels: { app: data-fetcher } }
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: engine-go-hpa }
    spec: { minReplicas: 2, maxReplicas: 10 }
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: api-hpa }
    spec: { minReplicas: 3, maxReplicas: 10 }
