# =============================================================================
# P2-08: Dev 环境 overlay — 单副本、低资源
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backtest-platform-dev
namespace: backtest-platform
resources:
  - ../../base  # 引用 base kustomization

# Dev 环境覆盖：单副本、降低资源限制
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: engine-go
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: data-fetcher
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Dev 环境禁用 HPA（单副本无需自动扩展）
patchesStrategicMerge:
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: engine-go-hpa
      namespace: backtest-platform
    spec:
      maxReplicas: 1
