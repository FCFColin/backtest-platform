apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backtest-platform-dev
resources:
  - ../../base
replicas:
  - name: api
    count: 1
  - name: engine-go
    count: 1
  - name: frontend
    count: 1
  - name: data-fetcher
    count: 1
  - name: backtest-worker
    count: 1
patches:
  - target: { kind: Deployment, name: backtest-worker }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { memory: 256Mi, cpu: 250m }
          limits: { memory: 512Mi, cpu: 500m }
patchesStrategicMerge:
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: engine-go-hpa }
    spec: { minReplicas: 1, maxReplicas: 1 }
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: api-hpa }
    spec: { minReplicas: 1, maxReplicas: 1 }
  - |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: { name: data-fetcher-hpa }
    spec: { minReplicas: 1, maxReplicas: 1 }
