apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-go
  labels:
    app: engine-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: engine-go
  template:
    metadata:
      labels:
        app: engine-go
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: engine-go
          image: backtest-platform/engine-go:v1.0.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 5004
          envFrom:
            - configMapRef:
                name: backtest-config
            - secretRef:
                name: auth-tokens
          resources:
            requests: { memory: '512Mi', cpu: '1' }
            limits: { memory: '2Gi', cpu: '2' }
          startupProbe:
            httpGet: { path: /api/engine/health, port: 5004 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/engine/health, port: 5004 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: 5004 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
