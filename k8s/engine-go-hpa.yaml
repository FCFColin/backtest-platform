# =============================================================================
# P2-03: Go 引擎水平自动扩展（HPA）
# =============================================================================
# 企业理由：Go 引擎是回测计算的核心服务，负载波动大（白天高峰、夜间低谷）。
# HPA 根据 CPU 利用率自动扩展 Pod 数量，保证高峰期计算能力，低谷期节省资源。
#
# 配置：
# - minReplicas: 2（与 ADR-031 单引擎故障转移策略一致）
# - maxReplicas: 10（防止失控扩展耗尽集群资源）
# - CPU target: 70%（留 30% 余量应对突增）
#
# 依赖：
# - metrics-server 需部署在集群中
# - engine-go deployment 需设置 resources.requests.cpu（HPA 基于请求值计算利用率）
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engine-go-hpa
  namespace: backtest-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engine-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
