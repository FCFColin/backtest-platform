apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: backtest-ca-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backtest-ca
spec:
  isCA: true
  commonName: backtest-ca
  secretName: backtest-ca-tls
  duration: 87600h # 10 年
  renewBefore: 720h
  issuerRef: { name: backtest-ca-issuer, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: backtest-cluster-issuer
spec:
  ca:
    secretName: backtest-ca-tls
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: enable-mtls
spec:
  host: '*.backtest-platform.svc.cluster.local'
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
