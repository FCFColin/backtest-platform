# Base — overlays 经 ../../base 引用（需 --load-restrictor LoadRestrictionsNone）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backtest-platform-base
namespace: backtest-platform
labels:
  - pairs:
      app.kubernetes.io/part-of: backtest-platform
    includeSelectors: false
resources:
  - ../namespace.yaml
  - ../configmap.yaml
  - ../auth-secret.yaml
  - ../deployments.yaml
  - ../services.yaml
  - ../hpas.yaml
  - ../pdbs.yaml
  - ../ingress.yaml
  - ../postgres.yaml
  - ../pgbouncer.yaml
  - ../redis.yaml
  - ../canary-deployment.yaml
  - ../mtls-issuer.yaml
  - ../prometheus-rules.yaml
  - ../alertmanager-deployment.yaml
  - ../network-policies/
patchesJson6902:
  - target: { group: cert-manager.io, version: v1, kind: Issuer, name: backtest-ca-issuer }
    patch: |
      - op: replace
        path: /metadata/namespace
        value: cert-manager
  - target: { group: cert-manager.io, version: v1, kind: Certificate, name: backtest-ca }
    patch: |
      - op: replace
        path: /metadata/namespace
        value: cert-manager
  - target:
      {
        group: monitoring.coreos.com,
        version: v1,
        kind: PrometheusRule,
        name: backtest-platform-alerts,
      }
    patch: |
      - op: replace
        path: /metadata/namespace
        value: monitoring
  - target:
      {
        group: apps,
        version: v1,
        kind: Deployment,
        name: 'api|engine-go|data-fetcher|backtest-worker|api-canary',
      }
    patch: |
      - op: add
        path: /spec/template/spec/securityContext
        value: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      - op: add
        path: /spec/template/spec/volumes
        value: [{ name: tmp, emptyDir: {} }]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{ name: tmp, mountPath: /tmp }]
  - target: { group: apps, version: v1, kind: Deployment, name: frontend }
    patch: |
      - op: add
        path: /spec/template/spec/securityContext
        value: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 }
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] } }
