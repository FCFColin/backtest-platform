# Base — overlays 经 ../../base 引用（需 --load-restrictor LoadRestrictionsNone）
# 直接 apply 用 k8s/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backtest-platform-base
namespace: backtest-platform
labels:
  - pairs:
      app.kubernetes.io/part-of: backtest-platform
    includeSelectors: false
resources:
  - ../namespace.yaml
  - ../configmap.yaml
  - ../auth-secret.yaml
  - ../api-deployment.yaml
  - ../services.yaml
  - ../hpas.yaml
  - ../pdbs.yaml
  - ../frontend-deployment.yaml
  - ../ingress.yaml
  - ../engine-go-deployment.yaml
  - ../data-fetcher-deployment.yaml
  - ../worker-deployment.yaml
  - ../postgres.yaml
  - ../pgbouncer.yaml
  - ../redis.yaml
  - ../canary-deployment.yaml
  - ../mtls-issuer.yaml
  - ../unleash-deployment.yaml
  - ../prometheus-rules.yaml
  - ../alertmanager-deployment.yaml
  - ../network-policies/
# Fix namespaces for non-backtest-platform resources (replacements run after transformers)
replacements:
  - targets:
      - select: { kind: Issuer, name: backtest-ca-issuer }
        fieldPaths: [metadata.namespace]
      - select: { kind: Certificate, name: backtest-ca }
        fieldPaths: [metadata.namespace]
    source: { value: cert-manager }
  - targets:
      - select: { kind: PrometheusRule }
        fieldPaths: [metadata.namespace]
    source: { value: monitoring }
