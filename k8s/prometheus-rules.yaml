# =============================================================================
# Prometheus 告警规则（含 Redis Sentinel 高可用告警，ADR-045 T7）
# =============================================================================
#
# 企业理由：ADR-045 部署 Redis Sentinel 后，需对故障转移事件告警——
# Sentinel 自动恢复 < 30s 是 SLO，但运维仍需感知：
# - master Pod 故障转移事件（sentinel 是否正常工作）
# - Sentinel 仲裁丢失（2/3 节点不可用即无法故障转移）
# - Redis 写入拒绝（min-slaves-to-write 触发，脑裂或全从节点失联）
#
# 部署：在 Prometheus 配置中 rule_files 引用此文件，或通过 PrometheusRule
# CRD（kube-prometheus-stack）应用。Alertmanager 通过 P1-10 配置通知渠道。
#
# 与 ADR-045 关键参数对应：
#   - sentinel failover-timeout mymaster 30000  → 30s 内告警
#   - min-slaves-to-write=1                     → RedisRefusedWrites 检测
#   - PDB minAvailable: 2 (Sentinel)            → SentinelQuorumLoss 检测
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-sentinel-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: backtest-platform
    prometheus: k8s
spec:
  groups:
    # =========================================================================
    # P0 告警：Redis Sentinel 故障转移与可用性（立即响应）
    # =========================================================================
    - name: redis-sentinel-critical
      rules:
        # Sentinel 检测到 master 不可用并触发故障转移
        # redis_sentinel_tilt 与 sentinel 的 SENTINEL master 命令的 o_down/s_down 状态对应
        - alert: RedisSentinelMasterDown
          expr: |
            max(redis_sentinel_master_status{state=~"s_down|o_down"} == 1) by (master, sentinel)
          for: 0s
          labels:
            severity: critical
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel reports master down ({{ $labels.master }})'
            description: |
              Sentinel {{ $labels.sentinel }} has marked master {{ $labels.master }} as down.
              Failover should complete within 30s (sentinel failover-timeout).
              If RedisSentinelFailoverInProgress persists > 1m, investigate Sentinel quorum.
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#master-down'

        # 故障转移进行中——Sentinel 正在选举新 master
        - alert: RedisSentinelFailoverInProgress
          expr: |
            max(redis_sentinel_master_failover_status{state="failover_in_progress"} == 1) by (master)
          for: 30s
          labels:
            severity: critical
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel failover in progress ({{ $labels.master }})'
            description: |
              Sentinel failover has been in progress for > 30s, exceeding
              failover-timeout (30000ms). Manual intervention may be required.
              Check: kubectl -n backtest-platform logs -l app=redis-sentinel
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#failover-stuck'

        # Redis 实例不可达（应用层 ping 失败）
        # redis_up 由 redis_exporter 提供；30s 容忍瞬时网络抖动
        - alert: RedisDown
          expr: redis_up == 0
          for: 30s
          labels:
            severity: critical
            category: redis-ha
          annotations:
            summary: 'Redis instance down'
            description: |
              Redis exporter reports redis_up == 0 for > 30s.
              In Sentinel mode, this indicates all pods unreachable
              (Sentinel should have failed over within 30s).
              Check: kubectl -n backtest-platform get pods -l app=redis
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#redis-down'

        # 写入被拒——min-slaves-to-write 触发，脑裂或全从节点失联
        # 应用层应通过 REDIS_UNAVAILABLE 503 感知；此处对 Redis 指标告警
        - alert: RedisRefusedWrites
          expr: |
            max(redis_rejected_connections_total) by (addr) > 0
            or
            max(rate(redis_errors_total{type="rejected"}[1m])) by (addr) > 0
          for: 1m
          labels:
            severity: critical
            category: redis-ha
          annotations:
            summary: 'Redis rejecting writes ({{ $labels.addr }})'
            description: |
              Redis is rejecting connections/writes. Likely cause:
              min-slaves-to-write=1 triggered (no slaves ACK within 10s lag).
              Check slave replication: redis-cli -h <master> INFO replication
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#rejected-writes'

    # =========================================================================
    # P1 告警：Sentinel 仲裁与从节点拓扑（30 分钟内响应）
    # =========================================================================
    - name: redis-sentinel-warning
      rules:
        # Sentinel 仲裁丢失——可用 Sentinel 数 < 2 (quorum=2)
        # PDB minAvailable: 2 保证自愿驱逐不破坏 quorum；非自愿驱逐需手动恢复
        - alert: RedisSentinelQuorumLoss
          expr: |
            count(up{job="redis-sentinel"} == 1) < 2
          for: 2m
          labels:
            severity: warning
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel quorum at risk'
            description: |
              Fewer than 2 Sentinel pods are reachable. Quorum (2) cannot be
              achieved if another Sentinel fails. PDB minAvailable: 2 should
              prevent voluntary eviction; check for involuntary node failures.
              Check: kubectl -n backtest-platform get pods -l app=redis-sentinel
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#quorum-loss'

        # 从节点数 < 1——min-slaves-to-write 即将触发
        - alert: RedisNoSlavesConnected
          expr: |
            max(redis_connected_slaves) by (addr) < 1
          for: 1m
          labels:
            severity: warning
            category: redis-ha
          annotations:
            summary: 'Redis master has no connected slaves'
            description: |
              Master {{ $labels.addr }} reports 0 connected slaves.
              min-slaves-to-write=1 will reject writes if lag > 10s.
              Check replica pods: kubectl -n backtest-platform get pods -l app=redis
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#no-slaves'

        # 从节点复制延迟过高——min-slaves-max-lag=10 即将触发
        - alert: RedisReplicationLagHigh
          expr: |
            max(redis_replication_lag_seconds) by (addr) > 5
          for: 2m
          labels:
            severity: warning
            category: redis-ha
          annotations:
            summary: 'Redis replication lag high ({{ $labels.addr }})'
            description: |
              Replication lag > 5s for > 2m. min-slaves-max-lag=10 will trigger
              write rejection soon. Check replica load and network.
              redis-cli -h <master> INFO replication
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#replication-lag'

        # Sentinel Pod 重启——可能丢失运行时状态（已重写 sentinel.conf）
        - alert: RedisSentinelPodRestart
          expr: |
            increase(kube_pod_container_status_restarts_total{container=~"sentinel"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel pod restarted'
            description: |
              Sentinel container restarted in the last 15m. Sentinel state is
              persisted to sentinel.conf (emptyDir) and re-read on startup.
              Verify quorum is still healthy: kubectl exec redis-sentinel-0 --
              redis-cli -p 26379 SENTINEL masters
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#pod-restart'

---
# =============================================================================
# P1-10 平台告警规则（backtest-platform-alerts）
# =============================================================================
#
# 企业理由：P0-05 仅覆盖 Redis Sentinel HA 告警；平台核心依赖（Go 引擎 / PostgreSQL /
# 熔断器 / 队列）与性能 SLO（错误率 / 延迟 / 复制 / 磁盘）缺运行时告警。
# 本 PrometheusRule 扩展（不覆盖 redis-sentinel-alerts），与
# docker/prometheus/rules.yml 内容对齐。
#
# 指标来源（packages/backend/src/utils/metrics.ts + 基础设施 exporter）：
#   circuit_breaker_state{name}                     应用层 prom-client
#   http_requests_total{method,route,status_code}   应用层 prom-client
#   http_request_duration_seconds_bucket            应用层 prom-client（直方图）
#   up{job=...}                                     Prometheus 抓取健康
#   pg_up / pg_replication_lag_seconds              postgres_exporter
#   bullmq_queue_size                               bullmq-exporter（需独立部署）
#   node_filesystem_avail_bytes / _size_bytes       node_exporter
#
# 注：RedisDown / RedisSentinelMasterDown 由 redis-sentinel-alerts（P0-05）已定义，不重复。
# AlertManager 通知通道与抑制规则见 k8s/alertmanager-deployment.yaml ConfigMap。
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backtest-platform-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: backtest-platform
    prometheus: k8s
spec:
  groups:
    # =========================================================================
    # P0 告警：核心依赖与熔断（立即响应）
    # =========================================================================
    - name: backtest-platform-critical
      interval: 15s
      rules:
        # Go 回测引擎不可达（ADR-031：唯一引擎，不可用即 fail-closed 503）
        - alert: GoEngineDown
          expr: up{job="engine-go"} == 0
          for: 1m
          labels:
            severity: critical
            service: engine-go
            category: availability
          annotations:
            summary: 'Go engine down ({{ $labels.instance }})'
            description: 'Go 回测引擎 {{ $labels.instance }} 抓取失败已 1 分钟。ADR-031 下引擎不可用 → API fail-closed 返回 503 + Retry-After，回测/蒙特卡洛/优化全部不可用。检查 Pod 状态与 /api/engine/health。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#go-engine-down'

        # 熔断器打开（ADR-016：引擎/PG 依赖熔断，open 态快速失败）
        # circuit_breaker_state: 0=closed, 1=open, 2=halfOpen
        - alert: CircuitBreakerOpen
          expr: circuit_breaker_state == 1
          for: 0m
          labels:
            severity: critical
            service: api
            category: resilience
          annotations:
            summary: 'Circuit breaker open ({{ $labels.name }})'
            description: '熔断器 {{ $labels.name }} 处于 Open 状态，相关依赖（Go 引擎 / PostgreSQL）调用快速失败。依据 ADR-016，需立即排查后端依赖健康（state=1=open，0=closed，2=halfOpen）。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#circuit-breaker-open'

        # PostgreSQL 不可用（ADR-007：主数据存储，不可用即全线降级）
        - alert: PostgresDown
          expr: pg_up == 0
          for: 30s
          labels:
            severity: critical
            service: postgres
            category: availability
          annotations:
            summary: 'PostgreSQL down ({{ $labels.instance }})'
            description: 'postgres_exporter 报告 pg_up == 0 已 30s。PostgreSQL 为主数据存储（ADR-007），不可用时认证/回测/审计均受影响。检查 PG 进程、PgBouncer、磁盘与复制状态。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#postgres-down'

        # 回测队列堆积（ADR-011：长任务异步化，BullMQ 队列深度 >100 持续 5m）
        - alert: BacktestQueueDepth
          expr: bullmq_queue_size > 100
          for: 5m
          labels:
            severity: critical
            service: api
            category: capacity
          annotations:
            summary: 'Backtest queue depth high ({{ $labels.queue }})'
            description: 'BullMQ 队列 {{ $labels.queue }} 深度 > 100 已持续 5 分钟，回测任务积压。检查 Worker 副本数 / 引擎吞吐 / 是否有卡死任务，必要时 HPA 扩容。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#backtest-queue-depth'

    # =========================================================================
    # P1 告警：性能与容量（30 分钟内响应）
    # =========================================================================
    - name: backtest-platform-warning
      interval: 30s
      rules:
        # 5xx 错误率 > 5%（5 分钟窗口）
        # http_requests_total 标签为 status_code（metrics.ts 实际命名）
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(http_requests_total[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: api
            category: errors
          annotations:
            summary: 'High 5xx error rate ({{ $value | humanizePercentage }})'
            description: '5xx 错误率 > 5% 已持续 5 分钟。按 route 拆分：sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (route)。排查引擎 fail-closed 503、PG 异常、限流 429 误归 5xx。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#high-error-rate'

        # PG 复制延迟 > 5s（P1-03 读写分离，从库滞后影响读一致性）
        - alert: ReplicationLag
          expr: pg_replication_lag_seconds > 5
          for: 2m
          labels:
            severity: warning
            service: postgres
            category: replication
          annotations:
            summary: 'PostgreSQL replication lag high ({{ $value }}s)'
            description: 'PG 复制延迟 > 5s 已持续 2 分钟，读副本数据滞后影响只读查询一致性（P1-03 读写分离）。检查从库负载、网络、长事务。pg_stat_replication 查看具体滞后。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#replication-lag'

        # P99 延迟 > 1s（5 分钟窗口）
        - alert: HighLatency
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
            service: api
            category: latency
          annotations:
            summary: 'High P99 latency ({{ $value }}s)'
            description: 'HTTP 请求 P99 延迟 > 1s 已持续 5 分钟。按 route 拆分定位慢端点：histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))。排查 DB 慢查询、引擎计算、事件循环阻塞。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#high-latency'

        # 磁盘可用空间 < 10%（node_exporter，排除 overlay/tmpfs 等伪文件系统）
        - alert: DiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}) < 0.10
          for: 5m
          labels:
            severity: warning
            service: node
            category: capacity
          annotations:
            summary: 'Disk space low ({{ $labels.mountpoint }}: {{ $value | humanizePercentage }} free)'
            description: '挂载点 {{ $labels.mountpoint }} 可用空间 < 10% 已持续 5 分钟。PG WAL / Redis AOF / 日志可能占满磁盘导致服务不可用。清理日志、扩容卷、检查 WAL 归档。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#disk-space-low'

        # P0-05：异常登录检测——IP 封锁计数激增（等保三级 8.1.4 b) 入侵防范）
        # auth_ip_lockout_total 由 loginLockout.ts 在 IP 封锁时递增
        # 5 分钟内 >3 个 IP 被封锁表明撞库攻击正在进行
        - alert: SuspiciousLoginActivity
          expr: increase(auth_ip_lockout_total[5m]) > 3
          for: 0m
          labels:
            severity: critical
            service: api
            category: security
          annotations:
            summary: '异常登录检测：{{ $value }} 个 IP 在 5 分钟内被封锁'
            description: '5 分钟内超过 3 个 IP 因跨账号登录失败被封锁，可能正在进行撞库攻击。检查 auth 日志中的 SUSPICIOUS_LOGIN_IP 事件，确认是否需要手动扩大封锁范围或启用 WAF 规则。'
            runbook_url: 'https://backtest.platform/runbooks/suspicious-login'

        # P0-06：WAL-G 备份过期（等保三级 8.1.4 数据备份与恢复）
        # 超过 26 小时无成功全量备份（每日备份 + 2h 容忍窗口）
        - alert: WalgBackupStale
          expr: time() - walg_backup_last_success_timestamp > 93600
          for: 5m
          labels:
            severity: critical
            service: postgres
            category: backup
          annotations:
            summary: 'WAL-G backup is stale (no backup in >26h)'
            description: '超过 26 小时没有成功的 WAL-G 全量备份。检查 ofelia 调度器状态与 MinIO 连接。等保三级 8.1.4 要求定期备份。'
            runbook_url: 'https://backtest.platform/docs/compliance/backup-restore'

        # P0-06：WAL 归档失败
        - alert: WalgArchiveFailure
          expr: increase(walg_backup_failed_total[5m]) > 0
          for: 0m
          labels:
            severity: warning
            service: postgres
            category: backup
          annotations:
            summary: 'WAL archive failures detected'
            description: 'PostgreSQL WAL 归档失败计数增加。检查 MinIO 连通性、磁盘空间与 WAL-G 配置。'
            runbook_url: 'https://backtest.platform/docs/compliance/backup-restore'
