apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backtest-platform-alerts
  labels:
    prometheus: k8s
spec:
  groups:
    - name: redis-sentinel-critical
      rules:
        - alert: RedisSentinelMasterDown
          expr: max(redis_sentinel_master_status{state=~"s_down|o_down"} == 1) by (master, sentinel)
          labels: &critical-redis-ha
            severity: critical
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel reports master down ({{ $labels.master }})'
            description: 'Sentinel {{ $labels.sentinel }} marked master {{ $labels.master }} down. Failover should complete within 30s.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#master-down'
        - alert: RedisSentinelFailoverInProgress
          expr: max(redis_sentinel_master_status{state="failover_in_progress"} == 1) by (master)
          for: 30s
          labels: *critical-redis-ha
          annotations:
            summary: 'Redis Sentinel failover in progress ({{ $labels.master }})'
            description: 'Failover > 30s, exceeding failover-timeout. Manual intervention may be required.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#failover-stuck'
        - alert: RedisDown
          expr: redis_up == 0
          for: 30s
          labels: *critical-redis-ha
          annotations:
            summary: 'Redis instance down'
            description: 'redis_up == 0 for > 30s. All pods unreachable in Sentinel mode.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#redis-down'
        - alert: RedisRefusedWrites
          expr: max(redis_rejected_connections_total) by (addr) > 0 or max(rate(redis_errors_total{type="rejected"}[1m])) by (addr) > 0
          for: 1m
          labels: *critical-redis-ha
          annotations:
            summary: 'Redis rejecting writes ({{ $labels.addr }})'
            description: 'min-slaves-to-write=1 triggered. Check slave replication.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#rejected-writes'
    - name: redis-sentinel-warning
      rules:
        - alert: RedisSentinelQuorumLoss
          expr: count(up{job="redis-sentinel"} == 1) < 2
          for: 2m
          labels: &warning-redis-ha
            severity: warning
            category: redis-ha
          annotations:
            summary: 'Redis Sentinel quorum at risk'
            description: 'Fewer than 2 Sentinel pods reachable. Quorum cannot be achieved if another fails.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#quorum-loss'
        - alert: RedisNoSlavesConnected
          expr: max(redis_connected_slaves) by (addr) < 1
          for: 1m
          labels: *warning-redis-ha
          annotations:
            summary: 'Redis master has no connected slaves'
            description: 'min-slaves-to-write=1 will reject writes if lag > 10s.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#no-slaves'
        - alert: RedisReplicationLagHigh
          expr: max(redis_replication_offset_diff_lag_seconds) by (addr) > 5
          for: 2m
          labels: *warning-redis-ha
          annotations:
            summary: 'Redis replication lag high ({{ $labels.addr }})'
            description: 'Replication lag > 5s for > 2m. min-slaves-max-lag=10 will trigger write rejection soon.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#replication-lag'
        - alert: RedisSentinelPodRestart
          expr: increase(kube_pod_container_status_restarts_total{container=~"sentinel"}[15m]) > 0
          labels: *warning-redis-ha
          annotations:
            summary: 'Redis Sentinel pod restarted'
            description: 'Sentinel container restarted. Verify quorum is still healthy.'
            runbook_url: 'https://backtest.platform/runbooks/redis-sentinel#pod-restart'
    - name: backtest-platform-critical
      interval: 15s
      rules:
        - alert: GoEngineDown
          expr: up{job="engine-go"} == 0
          for: 1m
          labels: { severity: critical, service: engine-go, category: availability }
          annotations:
            summary: 'Go engine down ({{ $labels.instance }})'
            description: 'Go 回测引擎抓取失败已 1 分钟。ADR-031 下引擎不可用 → API fail-closed 503。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#go-engine-down'
        - alert: CircuitBreakerOpen
          expr: circuit_breaker_state == 1
          labels: { severity: critical, service: api, category: resilience }
          annotations:
            summary: 'Circuit breaker open ({{ $labels.name }})'
            description: '熔断器 Open（ADR-016），需立即排查后端依赖健康。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#circuit-breaker-open'
        - alert: PostgresDown
          expr: pg_up == 0
          for: 30s
          labels: { severity: critical, service: postgres, category: availability }
          annotations:
            summary: 'PostgreSQL down ({{ $labels.instance }})'
            description: 'pg_up == 0 已 30s。PostgreSQL 为主数据存储（ADR-007）。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#postgres-down'
        - alert: BacktestQueueDepth
          expr: bullmq_queue_size > 100
          for: 5m
          labels: { severity: critical, service: api, category: capacity }
          annotations:
            summary: 'Backtest queue depth high ({{ $labels.queue }})'
            description: 'BullMQ 队列深度 > 100 已 5 分钟。检查 Worker 副本数 / 引擎吞吐。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#backtest-queue-depth'
        - alert: SuspiciousLoginActivity
          expr: increase(auth_ip_lockout_total[5m]) > 3
          labels: { severity: critical, service: api, category: security }
          annotations:
            summary: '异常登录检测：{{ $value }} 个 IP 在 5 分钟内被封锁'
            description: '5 分钟内超 3 个 IP 被封锁，可能撞库攻击。检查 SUSPICIOUS_LOGIN_IP 事件。'
            runbook_url: 'https://backtest.platform/runbooks/suspicious-login'
        - alert: WalgBackupStale
          expr: time() - walg_backup_last_success_timestamp > 93600
          for: 5m
          labels: { severity: critical, service: postgres, category: backup }
          annotations:
            summary: 'WAL-G backup is stale (no backup in >26h)'
            description: '超过 26 小时无 WAL-G 全量备份。检查 ofelia 调度器与 MinIO 连接。'
            runbook_url: 'https://backtest.platform/docs/compliance/data-governance'
    - name: backtest-platform-warning
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))) > 0.05
          for: 5m
          labels: { severity: warning, service: api, category: errors }
          annotations:
            summary: 'High 5xx error rate ({{ $value | humanizePercentage }})'
            description: '5xx 错误率 > 5% 已 5 分钟。排查引擎 503、PG 异常、限流误归 5xx。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#high-error-rate'
        - alert: ReplicationLag
          expr: pg_replication_lag > 5
          for: 2m
          labels: { severity: warning, service: postgres, category: replication }
          annotations:
            summary: 'PostgreSQL replication lag high ({{ $value }}s)'
            description: 'PG 复制延迟 > 5s 已 2 分钟（P1-03 读写分离）。检查从库负载。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#replication-lag'
        - alert: HighLatency
          expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
          for: 5m
          labels: { severity: warning, service: api, category: latency }
          annotations:
            summary: 'High P99 latency ({{ $value }}s)'
            description: 'HTTP P99 > 1s 已 5 分钟。排查 DB 慢查询、引擎计算、事件循环阻塞。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#high-latency'
        - alert: HighP90Latency
          expr: histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.1
          for: 5m
          labels: { severity: notice, service: api, category: latency }
          annotations:
            summary: 'High P90 latency ({{ $value }}s)'
            description: 'HTTP P90 > 100ms 已 5 分钟。排查缓存缺失和 DB 查询性能。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#high-latency'
        - alert: DiskSpaceLow
          expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}) < 0.10
          for: 5m
          labels: { severity: warning, service: node, category: capacity }
          annotations:
            summary: 'Disk space low ({{ $labels.mountpoint }}: {{ $value | humanizePercentage }} free)'
            description: '可用空间 < 10% 已 5 分钟。PG WAL / Redis AOF / 日志可能占满磁盘。'
            runbook_url: 'https://backtest.platform/runbooks/platform-alerts#disk-space-low'
        - alert: WalgArchiveFailure
          expr: increase(walg_backup_failed_total[5m]) > 0
          labels: { severity: warning, service: postgres, category: backup }
          annotations:
            summary: 'WAL archive failures detected'
            description: 'PostgreSQL WAL 归档失败。检查 MinIO 连通性、磁盘空间与 WAL-G 配置。'
            runbook_url: 'https://backtest.platform/docs/compliance/data-governance'
