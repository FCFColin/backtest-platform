# AlertManager StatefulSet + Service + ConfigMap (P1-10)
# Secret alertmanager-webhooks (pre-created by ops): FEISHU_WEBHOOK, DINGTALK_WEBHOOK
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: backtest-platform
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: backtest-platform
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: ["service"]
      - source_matchers: [alertname = "RedisDown"]
        target_matchers: [alertname =~ "RedisReplicationLagHigh|RedisNoSlavesConnected"]
        equal: ["instance"]
      - source_matchers: [alertname = "GoEngineDown"]
        target_matchers: [alertname =~ "HighErrorRate|DegradedResponseRateHigh"]
        equal: ["service"]
      - source_matchers: [alertname = "PostgresDown"]
        target_matchers: [alertname =~ "PgPoolWaiting|ReplicationLag"]
        equal: ["service"]
    route:
      group_by: ["alertname", "severity", "service"]
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "feishu-info"
      routes:
        - matchers: [severity = "critical"]
          receiver: "p0-feishu-dingtalk"
          group_wait: 0s
          repeat_interval: 30m
          continue: false
        - matchers: [severity = "warning"]
          receiver: "p1-feishu"
          group_wait: 30s
          repeat_interval: 1h
          continue: false
        - matchers: [severity = "info"]
          receiver: "feishu-info"
          group_wait: 5m
          repeat_interval: 4h
          continue: false
    receivers:
      - name: "p0-feishu-dingtalk"
        webhook_configs:
          - url: "${FEISHU_WEBHOOK}"
            send_resolved: true
            max_alerts: 0
          - url: "${DINGTALK_WEBHOOK}"
            send_resolved: true
            max_alerts: 0
      - name: "p1-feishu"
        webhook_configs:
          - url: "${FEISHU_WEBHOOK}"
            send_resolved: true
            max_alerts: 0
      - name: "feishu-info"
        webhook_configs:
          - url: "${FEISHU_WEBHOOK}"
            send_resolved: true
            max_alerts: 0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: backtest-platform
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: backtest-platform
spec:
  serviceName: alertmanager
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/part-of: backtest-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      initContainers:
        - name: render-config
          image: alpine:3.20
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext > /dev/null 2>&1
              envsubst < /tpl/alertmanager.yml > /rendered/alertmanager.yml
              echo "rendered alertmanager.yml ($(wc -c < /rendered/alertmanager.yml) bytes)"
          envFrom:
            - secretRef:
                name: alertmanager-webhooks
          volumeMounts:
            - name: config-template
              mountPath: /tpl
            - name: rendered-config
              mountPath: /rendered
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - containerPort: 9093
              name: alertmanager
          resources:
            requests: { memory: '32Mi', cpu: '0.05' }
            limits: { memory: '128Mi', cpu: '0.25' }
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9093 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: alertmanager-data
              mountPath: /alertmanager
      volumes:
        - name: config-template
          configMap:
            name: alertmanager-config
        - name: rendered-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: alertmanager-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: redis-data # reuse Retain StorageClass (ADR-045)
        resources:
          requests: { storage: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: backtest-platform
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: backtest-platform
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: alertmanager
  selector:
    app: alertmanager
