# =============================================================================
# Unleash 特性开关服务 K8s 生产部署（P1-03 T1）
# =============================================================================
# 企业理由：特性开关解耦发布与部署。Unleash 服务端集中管理 flag 定义与策略，
# SDK 本地缓存 + 定期轮询（<30s 同步）。生产环境 2 副本 + PDB 保证可用性。
#
# 部署：kubectl apply -f k8s/unleash-deployment.yaml -f k8s/unleash-secret.yaml
# 验证：kubectl apply --dry-run=client -f k8s/unleash-deployment.yaml
#
# 依赖：PostgreSQL（共享主库，UNLEASH 使用独立 schema）、Redis（flag 快照缓存）
# 暴露：ClusterIP unleash:4242（集群内访问），Ingress 可选
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  namespace: backtest-platform
  labels:
    app: unleash
    app.kubernetes.io/part-of: backtest-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: unleash
          image: unleashorg/unleash-server:5.12.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4242
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unleash-secret
                  key: database-url
            - name: INIT_ADMIN_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: unleash-secret
                  key: admin-api-token
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 35
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  namespace: backtest-platform
  labels:
    app: unleash
spec:
  selector:
    app: unleash
  ports:
    - port: 4242
      targetPort: 4242
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unleash-pdb
  namespace: backtest-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: unleash
