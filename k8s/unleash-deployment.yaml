apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  labels:
    app: unleash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 35
      containers:
        - name: unleash
          image: unleashorg/unleash-server:5.12.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 4242
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: unleash-secret, key: database-url }
            - name: INIT_ADMIN_API_TOKENS
              valueFrom:
                secretKeyRef: { name: unleash-secret, key: admin-api-token }
          resources:
            requests: { memory: '256Mi', cpu: '100m' }
            limits: { memory: '512Mi', cpu: '500m' }
          livenessProbe:
            httpGet: { path: /health, port: 4242 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 4242 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  labels:
    app: unleash
spec:
  selector:
    app: unleash
  ports:
    - port: 4242
      targetPort: 4242
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unleash-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: unleash
