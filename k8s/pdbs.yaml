# PodDisruptionBudgets — 滚动更新/节点维护时保证最小可用副本数
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-go-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: engine-go
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-fetcher-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data-fetcher
---
# Worker: maxUnavailable=0 — 自愿中断期间不被驱逐，直到替代 Pod 就绪
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: backtest-worker
