apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  type: ClusterIP
  selector: { app: api }
  ports: [{ port: 5001, targetPort: 5001, name: api }]
---
apiVersion: v1
kind: Service
metadata: { name: engine-go }
spec:
  type: ClusterIP
  selector: { app: engine-go }
  ports: [{ port: 5004, targetPort: 5004 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, name: http }]
---
apiVersion: v1
kind: Service
metadata: { name: data-fetcher }
spec:
  type: ClusterIP
  selector: { app: data-fetcher }
  ports: [{ port: 5003, targetPort: 5003, name: data }]
