            httpGet: { path: /api/data/health, port: 5003 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/data/health, port: 5003 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: 5003 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  labels:
    app: backtest-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: backtest-worker }
  template:
    metadata:
      labels: { app: backtest-worker }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: backtest-platform/worker:v1.0.0
          resources:
            requests: { memory: '512Mi', cpu: '0.5' }
            limits: { memory: '1Gi', cpu: '1' }
          env:
            - { name: WORKER_CONCURRENCY, value: '3' }
          envFrom:
            - { configMapRef: { name: backtest-config } }
            - { secretRef: { name: postgres-secret } }
            - { secretRef: { name: auth-tokens } }
          livenessProbe:
            exec:
              {
                command:
                  [
                    '/bin/sh',
                    '-c',
                    'redis-cli -h redis -a "$REDIS_PASSWORD" --raw get worker:heartbeat | grep -q .',
                  ],
              }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
