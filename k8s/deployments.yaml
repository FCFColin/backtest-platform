apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: api
          image: backtest-platform/api:v1.0.0
          ports: [{ containerPort: 5001 }]
          resources:
            requests: { memory: '256Mi', cpu: '0.5' }
            limits: { memory: '1Gi', cpu: '1' }
          startupProbe:
            httpGet: { path: /api/health, port: 5001 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          envFrom:
            - { configMapRef: { name: backtest-config } }
            - { secretRef: { name: postgres-secret } }
            - { secretRef: { name: auth-tokens } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: frontend
          image: backtest-platform/frontend:v1.0.0
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: '64Mi', cpu: '0.1' }
            limits: { memory: '256Mi', cpu: '0.5' }
          startupProbe:
            httpGet: { path: /, port: 80 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-go
  labels:
    app: engine-go
spec:
  replicas: 2
  selector:
    matchLabels: { app: engine-go }
  template:
    metadata:
      labels: { app: engine-go }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: engine-go
          image: backtest-platform/engine-go:v1.0.0
          ports: [{ containerPort: 5004 }]
          envFrom:
            - { configMapRef: { name: backtest-config } }
            - { secretRef: { name: auth-tokens } }
          resources:
            requests: { memory: '512Mi', cpu: '1' }
            limits: { memory: '2Gi', cpu: '2' }
          startupProbe:
            httpGet: { path: /api/engine/health, port: 5004 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/engine/health, port: 5004 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/ready, port: 5004 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
