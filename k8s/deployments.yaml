  labels:
    app: data-fetcher
spec:
  replicas: 2
  selector:
    matchLabels: { app: data-fetcher }
  template:
    metadata:
      labels: { app: data-fetcher }
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: data-fetcher
          image: backtest-platform/data-fetcher:v1.0.0
          ports: [{ containerPort: 5003 }]
          envFrom:
            - { configMapRef: { name: backtest-config } }
            - { secretRef: { name: postgres-secret } }
            - { secretRef: { name: auth-tokens } }
          resources:
