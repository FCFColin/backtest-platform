# =============================================================================
# Worker Deployment（P0-1）
# =============================================================================
# 企业理由：BullMQ Worker 独立部署，与 API 服务解耦。
# - API 崩溃/重启不影响正在处理的回测任务
# - Worker 可独立资源配置（CPU/内存按计算负载调优）
# - BullMQ 天然防并发重复处理，单副本即可（多副本需配合并发控制）
#
# Worker 无 HTTP 端口，探针通过 exec 读取 Redis heartbeat。
# terminationGracePeriodSeconds=60 给 Worker 足够时间完成当前任务。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  namespace: backtest-platform
  labels:
    app: backtest-worker
    app.kubernetes.io/part-of: backtest-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtest-worker
  template:
    metadata:
      labels:
        app: backtest-worker
        app.kubernetes.io/part-of: backtest-platform
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: backtest-platform/worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: '512Mi'
              cpu: '0.5'
            limits:
              memory: '1Gi'
              cpu: '1'
          env:
            - name: WORKER_CONCURRENCY
              value: '3'
          envFrom:
            - configMapRef:
                name: backtest-config
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: auth-tokens
          # 健康检查：读取 Redis heartbeat（Worker 无 HTTP 端口）
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const redis = new (require('ioredis'))(process.env.REDIS_URL || 'redis://redis:6379');
                  redis.get('worker:heartbeat')
                    .then(v => { redis.quit(); process.exit(v ? 0 : 1); })
                    .catch(() => process.exit(1));
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
