apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-worker
  labels:
    app: backtest-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtest-worker
  template:
    metadata:
      labels:
        app: backtest-worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: backtest-platform/worker:v1.0.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { memory: '512Mi', cpu: '0.5' }
            limits: { memory: '1Gi', cpu: '1' }
          env:
            - name: WORKER_CONCURRENCY
              value: '3'
          envFrom:
            - configMapRef:
                name: backtest-config
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: auth-tokens
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const redis = new (require('ioredis'))(process.env.REDIS_URL || 'redis://redis:6379');
                  redis.get('worker:heartbeat')
                    .then(v => { redis.quit(); process.exit(v ? 0 : 1); })
                    .catch(() => process.exit(1));
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
