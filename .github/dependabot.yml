# 权衡：PR 噪音 vs 安全自动化，通过 commit-message prefix 和 label 过滤管理
version: 2
updates:
  # npm（根 lockfile 覆盖 workspace）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - npm

  # Go（3 个独立 module）
  - package-ecosystem: gomod
    directory: /data-fetcher
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - go

  - package-ecosystem: gomod
    directory: /engine-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - go

  - package-ecosystem: gomod
    directory: /packages/go-shared
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - go

  # Docker（根 + 3 子目录 Dockerfile）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /data-fetcher
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /engine-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /docker/worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  # GitHub Actions（供应链安全）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - ci
