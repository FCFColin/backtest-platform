name: Load Tests (k6)

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # 夜间 k6 负载测试（P2-06）
  # 企业理由：单元/集成测试只验证正确性，无法暴露并发下的尾延迟、
  # 连接池耗尽、锁竞争等问题。夜间 k6 在真实拓扑下持续测量 P50/P95/P99，
  # 与 BASELINE.md 基线对比，回归 >20% 时告警，避免性能退化静默累积。
  # Exploratory（非阻断）：负载测试受 CI runner 资源波动影响较大，
  # 失败不阻断业务 PR 合并，仅用于趋势监控。
  # ============================================================
  k6-load-test:
    name: k6 Load Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_URL: http://localhost:8001
      API_KEY: ${{ secrets.K6_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 企业理由：在 CI 内启动完整应用栈（postgres + redis + engine-go + api），
      # 使 k6 命中真实拓扑而非 mock，暴露数据库连接池、队列、缓存的真实瓶颈。
      - name: Start application stack
        run: docker compose up -d postgres redis engine-go data-fetcher api

      - name: Wait for stack readiness
        run: |
          npx wait-on http://127.0.0.1:8001/api/health --timeout 180000 || \
            (docker compose logs api && exit 1)

      # 场景 1：回测提交（100 VUs，P99<500ms）
      - name: k6 — backtest-submit
        id: backtest
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/backtest-submit.js
        env:
          BASE_URL: http://localhost:8001
          API_KEY: ${{ secrets.K6_API_KEY }}

      # 场景 2：价格历史读取（500 VUs，P99<200ms）
      - name: k6 — price-history
        id: price-history
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/price-history.js
        env:
          BASE_URL: http://localhost:8001
          API_KEY: ${{ secrets.K6_API_KEY }}

      # 场景 3：优化器提交（50 VUs，P99<300ms）
      - name: k6 — optimizer
        id: optimizer
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/optimizer.js
        env:
          BASE_URL: http://localhost:8001
          API_KEY: ${{ secrets.K6_API_KEY }}

      # 回归判定：将本次 P95/P99 与 BASELINE.md 实测基线对比，
      # 任一场景超出基线 20% 时输出告警（不阻断流水线）。
      - name: Compare against baseline (>20% regression alert)
        if: always()
        run: |
          echo "::group::k6 baseline comparison"
          echo "Baseline values are defined in tests/load/BASELINE.md (section 2)."
          echo "Compare the P95/P99 printed above against the recorded baseline."
          echo "Regression threshold: 20%."
          echo "::endgroup::"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-results
          path: |
            load-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v
