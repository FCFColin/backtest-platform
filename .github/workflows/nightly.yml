name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 18 * * *' # 每天 02:00 (Asia/Shanghai, UTC+8) 运行
  workflow_dispatch: {} # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# 企业理由：基准测试从必跑 CI（ci.yml）移出，以加速 PR 反馈。
# Nightly 运行持续量化核心操作性能，检测性能退化，不阻断日常开发。
# 对应 RO-026：benchmark 不再阻塞合并，改为每日定时执行。
jobs:
  go-data-fetcher-bench:
    name: Go Data-Fetcher Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-fetcher
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: data-fetcher/go.sum

      - name: Build
        run: go build ./...

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run=^$ ./...

  go-engine-bench:
    name: Go Engine Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-go
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: engine-go/go.sum

      - name: Build
        run: go build ./...

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run=^$ -timeout=120s ./...

  docker-security-scan:
    name: Docker Image Scan + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read # job 级覆盖 workflow 级；缺此项 checkout 会 403
      security-events: write # SARIF 上传到 GitHub Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API image
        run: docker build -f Dockerfile.backend -t backtest-api:scan .
      # 构建上下文统一为仓库根（Dockerfile 内 COPY data-fetcher/ 与 packages/go-shared）
      - name: Build data-fetcher image
        run: docker build -f data-fetcher/Dockerfile -t data-fetcher:scan .
      - name: Build engine image
        run: docker build -f engine-go/Dockerfile -t engine-go:scan .
      - name: Build worker image
        run: docker build -f docker/worker/Dockerfile -t backtest-worker:scan .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t frontend:scan .

      # Trivy 镜像扫描（nightly 而非 PR，检测最终交付镜像的基础层/产物漏洞）
      # 每个扫描 continue-on-error 确保 5 镜像全部扫完并生成完整 SARIF，末尾 gate 统一判定
      - name: Trivy scan API
        id: trivy-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: backtest-api:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-api.sarif
      - name: Trivy scan data-fetcher
        id: trivy-data-fetcher
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: data-fetcher:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-data-fetcher.sarif
      - name: Trivy scan engine-go
        id: trivy-engine
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: engine-go:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-engine.sarif
      - name: Trivy scan worker
        id: trivy-worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: backtest-worker:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-worker.sarif
      - name: Trivy scan frontend
        id: trivy-frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: frontend:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif

      - name: Merge SARIF
        if: always()
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const files = ['trivy-api.sarif', 'trivy-data-fetcher.sarif', 'trivy-engine.sarif', 'trivy-worker.sarif', 'trivy-frontend.sarif'];
          const merged = { $schema: 'https://json.schemastore.org/sarif-2.1.0.json', version: '2.1.0', runs: [] };
          for (const f of files) {
            if (fs.existsSync(f)) merged.runs.push(...JSON.parse(fs.readFileSync(f, 'utf8')).runs);
          }
          fs.writeFileSync('trivy-results.sarif', JSON.stringify(merged, null, 2));
          SCRIPT
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        with:
          sarif_file: trivy-results.sarif
      - name: Security gate (block on CRITICAL/HIGH)
        if: always()
        run: |
          if [ "${{ steps.trivy-api.outcome }}" = "failure" ] || \
             [ "${{ steps.trivy-data-fetcher.outcome }}" = "failure" ] || \
             [ "${{ steps.trivy-engine.outcome }}" = "failure" ] || \
             [ "${{ steps.trivy-worker.outcome }}" = "failure" ] || \
             [ "${{ steps.trivy-frontend.outcome }}" = "failure" ]; then
            echo "::error::Trivy 发现 CRITICAL/HIGH 可修复漏洞，阻断"
            exit 1
          fi

      # SBOM（CycloneDX）— 恢复 NOTICE/security.md 承诺的 sbom-cyclonedx 制品
      - name: SBOM (API)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: backtest-api:scan
          format: cyclonedx-json
          output-file: sbom-backtest-api.json
      - name: SBOM (data-fetcher)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: data-fetcher:scan
          format: cyclonedx-json
          output-file: sbom-data-fetcher.json
      - name: SBOM (engine-go)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: engine-go:scan
          format: cyclonedx-json
          output-file: sbom-engine-go.json
      - name: SBOM (worker)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: backtest-worker:scan
          format: cyclonedx-json
          output-file: sbom-backtest-worker.json
      - name: SBOM (frontend)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: frontend:scan
          format: cyclonedx-json
          output-file: sbom-frontend.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom-*.json
          retention-days: 30

  e2e-and-chaos:
    name: E2E + Chaos
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '11.5.3'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Start infra containers
        run: docker compose up -d postgres redis engine-go data-fetcher

      - name: Build frontend (SERVE_STATIC 供 Playwright)
        run: pnpm build:frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # webServer (scripts/e2e-servers.mjs) 以 tsx 起后端并绑定 API_PORT 15001；
      # E2E 结束后 playwright 会终止该进程，sleep 让端口释放后再由 compose api 接管
      - name: Run E2E
        run: pnpm test:e2e:ui
        env:
          JWT_SECRET: dev-only-jwt-secret-change-in-production
          ENGINE_AUTH_TOKEN: dev-engine-auth-token
          DATA_SERVICE_AUTH_TOKEN: dev-data-service-auth-token

      - name: Start API + worker containers
        run: |
          sleep 5
          docker compose up -d api worker

      - name: Live contract verification
        run: pnpm run audit:contract
        env:
          API_URL: http://localhost:15001

      - name: Run Chaos tests
        run: pnpm test:chaos
        env:
          METRICS_AUTH_TOKEN: dev-metrics-token

      - name: Teardown compose stack
        if: always()
        run: docker compose down --remove-orphans

  loc-stats:
    name: Line Count Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install scc
        run: |
          curl -sL https://github.com/boyter/scc/releases/download/v3.7.0/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          mkdir -p /tmp/scc
          tar -xzf scc.tar.gz -C /tmp/scc
          echo "/tmp/scc" >> $GITHUB_PATH
      - name: Count lines
        run: scc --exclude-dir node_modules,dist,dist-ssr,.dev-logs,coverage,.git,data,report,.turbo,.cache,.vite,playwright-report,test-results,docs/audit,.github,.husky,.devcontainer,docker,config,k8s --no-cocomo --sort lines
