name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 18 * * *' # 每天 02:00 (Asia/Shanghai, UTC+8) 运行
  workflow_dispatch: {} # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# 企业理由：基准测试从必跑 CI（ci.yml）移出，以加速 PR 反馈。
# Nightly 运行持续量化核心操作性能，检测性能退化，不阻断日常开发。
# 对应 RO-026：benchmark 不再阻塞合并，改为每日定时执行。
jobs:
  go-data-fetcher-bench:
    name: Go Data-Fetcher Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-fetcher
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: data-fetcher/go.sum

      - name: Build
        run: go build ./...

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run=^$ ./...

  go-engine-bench:
    name: Go Engine Benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-go
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: engine-go/go.sum

      - name: Build
        run: go build ./...

      - name: Benchmark
        run: go test -bench=. -benchmem -count=1 -run=^$ -timeout=120s ./...

  docker-security-scan:
    name: Docker Image Scan + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read # job 级覆盖 workflow 级；缺此项 checkout 会 403
      security-events: write # SARIF 上传到 GitHub Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API image
        run: docker build -f Dockerfile.backend -t backtest-api:scan .
      # 构建上下文统一为仓库根（Dockerfile 内 COPY data-fetcher/ 与 packages/go-shared）
      - name: Build data-fetcher image
        run: docker build -f data-fetcher/Dockerfile -t data-fetcher:scan .
      - name: Build engine image
        run: docker build -f engine-go/Dockerfile -t engine-go:scan .
      - name: Build worker image
        run: docker build -f docker/worker/Dockerfile -t backtest-worker:scan .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t frontend:scan .

      # Trivy 镜像扫描（nightly 而非 PR，检测最终交付镜像的基础层/产物漏洞）
      # 每个扫描 continue-on-error 确保 5 镜像全部扫完并生成完整 SARIF，末尾 gate 统一判定
      - name: Trivy scan API
        id: trivy-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: backtest-api:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-api.sarif
      - name: Trivy scan data-fetcher
        id: trivy-data-fetcher
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: data-fetcher:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-data-fetcher.sarif
      - name: Trivy scan engine-go
        id: trivy-engine
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: engine-go:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-engine.sarif
      - name: Trivy scan worker
        id: trivy-worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: backtest-worker:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-worker.sarif
      - name: Trivy scan frontend
        id: trivy-frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          image-ref: frontend:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif

      - name: Merge SARIF
        if: always()
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const files = ['trivy-api.sarif', 'trivy-data-fetcher.sarif', 'trivy-engine.sarif', 'trivy-worker.sarif', 'trivy-frontend.sarif'];
          const merged = { $schema: 'https://json.schemastore.org/sarif-2.1.0.json', version: '2.1.0', runs: [] };
          for (const f of files) {
            if (fs.existsSync(f)) merged.runs.push(...JSON.parse(fs.readFileSync(f, 'utf8')).runs);
          }
          fs.writeFileSync('trivy-results.sarif', JSON.stringify(merged, null, 2));
          SCRIPT
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        with:
          sarif_file: trivy-results.sarif
      - name: Security gate (block on CRITICAL/HIGH)
        if: always()
        env:
          OUTCOME_API: ${{ steps.trivy-api.outcome }}
          OUTCOME_DATA: ${{ steps.trivy-data-fetcher.outcome }}
          OUTCOME_ENGINE: ${{ steps.trivy-engine.outcome }}
          OUTCOME_WORKER: ${{ steps.trivy-worker.outcome }}
          OUTCOME_FRONTEND: ${{ steps.trivy-frontend.outcome }}
        run: |
          if [ "$OUTCOME_API" = "failure" ] || \
             [ "$OUTCOME_DATA" = "failure" ] || \
             [ "$OUTCOME_ENGINE" = "failure" ] || \
             [ "$OUTCOME_WORKER" = "failure" ] || \
             [ "$OUTCOME_FRONTEND" = "failure" ]; then
            echo "::error::Trivy CRITICAL/HIGH findings — blocked"
            exit 1
          fi

      # SBOM（CycloneDX）— 恢复 NOTICE/security.md 承诺的 sbom-cyclonedx 制品
      - name: SBOM (API)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: backtest-api:scan
          format: cyclonedx-json
          output-file: sbom-backtest-api.json
      - name: SBOM (data-fetcher)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: data-fetcher:scan
          format: cyclonedx-json
          output-file: sbom-data-fetcher.json
      - name: SBOM (engine-go)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: engine-go:scan
          format: cyclonedx-json
          output-file: sbom-engine-go.json
      - name: SBOM (worker)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: backtest-worker:scan
          format: cyclonedx-json
          output-file: sbom-backtest-worker.json
      - name: SBOM (frontend)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: frontend:scan
          format: cyclonedx-json
          output-file: sbom-frontend.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom-*.json
          retention-days: 30

  e2e-and-chaos:
    name: E2E + Chaos
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '11.5.3'
      # compose override 将 PG/Redis 映射到 15442/16381；e2e-servers.mjs 会透传，
      # 否则后端回落到默认 5432/6379 连不上
      DATABASE_URL: postgresql://backtest_app:backtest_app_dev@localhost:15442/backtest_test
      REDIS_URL: redis://localhost:16381
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Start infra containers
        run: docker compose up -d postgres redis engine-go data-fetcher

      - name: Build frontend (SERVE_STATIC 供 Playwright)
        run: pnpm build:frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # least-privilege 流程：超管先迁移（backtest_test 供 e2e，backtest 供后续 compose api/worker 契约检查），
      # 应用角色 backtest_app 仅 DML（ADR-009）；迁移需 timescaledb 扩展（CREATE EXTENSION 需超管）。
      - name: Migrate test/app DBs (superuser)
        run: |
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U backtest && break; sleep 2; done
          for db in backtest_test backtest; do
            DATABASE_URL="postgresql://backtest:backtest@localhost:15442/$db" pnpm --filter @backtest/backend run migrate
          done

      # webServer (scripts/e2e-servers.mjs) 以 tsx 起后端并绑定 API_PORT 15001；
      # E2E 结束后 playwright 会终止该进程，sleep 让端口释放后再由 compose api 接管
      - name: Run E2E
        run: pnpm test:e2e:ui
        env:
          JWT_SECRET: dev-only-jwt-secret-change-in-production
          ENGINE_AUTH_TOKEN: dev-engine-auth-token
          DATA_SERVICE_AUTH_TOKEN: dev-data-service-auth-token

      - name: Start API + worker containers
        run: |
          sleep 5
          docker compose up -d api worker

      - name: Live contract verification
        run: pnpm run audit:contract
        env:
          API_URL: http://localhost:15001

      - name: Run Chaos tests
        run: pnpm test:chaos
        env:
          METRICS_AUTH_TOKEN: dev-metrics-token

      - name: Teardown compose stack
        if: always()
        run: docker compose down --remove-orphans

  loc-stats:
    name: Line Count Stats
    runs-on: ubuntu-latest
    # ε-1 ledger 追加+推送需要 contents:write（job 级覆盖 workflow 级 contents:read）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install scc
        run: |
          curl -sL https://github.com/boyter/scc/releases/download/v3.7.0/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          echo "38c292dc5d7405b96a4698032a4e8e8e37b71cd38e3b87c4e6a6f7c2805ef8f4  scc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/scc
          tar -xzf scc.tar.gz -C /tmp/scc
          echo "/tmp/scc" >> $GITHUB_PATH
      # 排除串单一事实源：scripts/loc-exclude.txt（与 scripts/count-loc.ps1 同读，防双实现漂移）
      - name: Count lines
        run: scc --exclude-dir "$(cat scripts/loc-exclude.txt | tr -d '[:space:]')" --no-cocomo --sort lines
      # 行数硬指标门禁（AGENTS.md：目标 <= 100,000 行）；排除串与 count-loc.ps1 一致
      - name: Enforce LOC budget
        run: |
          total=$(scc --exclude-dir "$(cat scripts/loc-exclude.txt | tr -d '[:space:]')" --no-cocomo --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r.reduce((n,f)=>n+f.Lines,0))})")
          echo "LOC total: $total (budget: <= 100000)"
          if [ "$total" -gt 100000 ]; then echo "FAIL: over 100k LOC budget"; exit 1; fi
      # ε-1 全局 LOC 账本（R-02 v2：硬门禁数据源，代理无自评权）
      # 注意：不做 sort -u——账本是 append-only 时序流，排序会破坏时间序并合并同日多条观测
      - name: Append LOC ledger entry
        run: |
          total=$(scc --exclude-dir "$(cat scripts/loc-exclude.txt | tr -d '[:space:]')" --no-cocomo --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(r.reduce((n,f)=>n+f.Lines,0))})")
          date=$(date -u +%Y-%m-%d)
          printf '{"date":"%s","total":%s,"commit":"%s"}\n' "$date" "$total" "${{ github.sha }}" >> docs/audit/loc-ledger.jsonl
          git config user.email "ci-bot@noreply"
          git config user.name "CI Bot"
          git add docs/audit/loc-ledger.jsonl
          git diff --cached --quiet || git commit -m "chore(ci): nightly LOC $date [skip ci]"
          git push
