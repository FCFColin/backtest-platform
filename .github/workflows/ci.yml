# CI/CD 工作流（附录 C：验证脚本 + CRITICAL 回归门控）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '11.5.3'
  DATABASE_URL: postgresql://backtest_app:backtest_app_dev@localhost:15442/backtest_test
  REDIS_URL: redis://localhost:16381

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # gitleaks-action 上传 SARIF 到 Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF 上传到 GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      # 固定 commit SHA（CVE-2026-33634 供应链事件后 trivy-action 禁用可变 tag）
      - name: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,dist,dist-ssr,coverage,.git,.dev-logs,data,report,test-results,.turbo
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  lint-and-typecheck:
    name: Lint + TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # 阈值 10：exhaustive-deps 等 warn 项允许少量存在（当前 0 违规），超 10 即失败
      - run: pnpm exec eslint . --max-warnings 10
      - run: pnpm format:check
      - run: pnpm check
      # i18n 键完整性门禁：防止收敛误删仍被引用的键（历史回归：e8a0d805 / 83f9be11）
      - run: pnpm run audit:i18n
      # 供应链门禁：prod 依赖 CRITICAL/HIGH 漏洞阻断，moderate/low 仅告警（scripts/audit-supply.mjs）
      - run: pnpm run audit:supply

  migration-check:
    name: Migration Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-migrations.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # TS 测试唯一门禁：完整套件（unit/contract/integration-skip）带覆盖率检查。
      # 阈值以 scripts/check-coverage.mjs 为权威源（80/80/80/80）。
      - run: pnpm test:coverage:check

  critical-verify:
    name: CRITICAL Fix Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
            packages/go-shared/go.sum
      - name: Run static verification scripts
        run: pnpm verify:critical --skip-db --skip-frontend
      # Go 官方漏洞扫描：基于调用图只报实际受影响漏洞
      - name: govulncheck (engine-go)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: engine-go
      - name: govulncheck (data-fetcher)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: data-fetcher
      - name: govulncheck (go-shared)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: packages/go-shared

  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
            packages/go-shared/go.sum
      - name: golangci-lint (engine-go)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: engine-go
          args: --config=../.golangci.yml
      - name: golangci-lint (data-fetcher)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: data-fetcher
          args: --config=../.golangci.yml
      - name: golangci-lint (go-shared)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: packages/go-shared
          args: --config=../../.golangci.yml

  deadcode:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm deadcode
