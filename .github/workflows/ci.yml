# CI/CD 工作流（附录 C：验证脚本 + CRITICAL 回归门控）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '11.5.3'
  DATABASE_URL: postgresql://backtest_app:backtest_app_dev@localhost:15442/backtest_test
  REDIS_URL: redis://localhost:16379

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF 上传到 GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      # 固定 commit SHA（CVE-2026-33634 供应链事件后 trivy-action 禁用可变 tag）
      - name: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  lint-and-typecheck:
    name: Lint + TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # 阈值 10：exhaustive-deps 等 warn 项允许少量存在（当前 0 违规），超 10 即失败
      - run: pnpm exec eslint . --max-warnings 10
      - run: pnpm format:check
      - run: pnpm check
      # 供应链门禁：prod 依赖 CRITICAL/HIGH 漏洞阻断，moderate/low 仅告警（scripts/audit-supply.mjs）
      - run: pnpm run audit:supply

  migration-check:
    name: Migration Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-migrations.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # C5-2026-08：unit-tests 改为带覆盖率的门禁检查（此前仅跑测试不收集覆盖率，门禁形同虚设）。
      # 阈值以 scripts/check-coverage.mjs 为权威源（当前 80/80/80/80）。
      - run: pnpm test:coverage:check

  critical-verify:
    name: CRITICAL Fix Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
      - name: Run static verification scripts
        run: pnpm verify:critical --skip-db --skip-frontend
      - name: Run Zod coverage verification
        run: pnpm verify:high
      # Go 官方漏洞扫描：基于调用图只报实际受影响漏洞（engine-go / data-fetcher）
      - name: govulncheck (engine-go)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: engine-go
      - name: govulncheck (data-fetcher)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: data-fetcher

  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
      # 配置见 engine-go/.golangci.yml 与 data-fetcher/.golangci.yml（gosec 已启用）
      - name: golangci-lint (engine-go)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: engine-go
      - name: golangci-lint (data-fetcher)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: data-fetcher

  deadcode:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm deadcode

  loc-stats:
    name: Line Count Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scc
        run: |
          curl -sL https://github.com/boyter/scc/releases/download/v3.7.0/scc_Linux_x86_64.tar.gz -o scc.tar.gz
          mkdir -p /tmp/scc
          tar -xzf scc.tar.gz -C /tmp/scc
          echo "/tmp/scc" >> $GITHUB_PATH
      - name: Count lines
        run: scc --exclude-dir node_modules,dist,dist-ssr,.dev-logs,coverage,.git,data,report,.turbo,.cache,.vite,playwright-report,test-results --no-cocomo --sort lines

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm test:contract
