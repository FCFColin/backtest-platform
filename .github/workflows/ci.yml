# CI/CD 工作流（附录 C：验证脚本 + CRITICAL 回归门控）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '11'
  DATABASE_URL: postgresql://backtest_app:backtest_app_dev@localhost:15442/backtest_test
  REDIS_URL: redis://localhost:16379

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-typecheck:
    name: Lint + TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # 阈值 10：exhaustive-deps 等 warn 项允许少量存在（当前 0 违规），超 10 即失败
      - run: pnpm exec eslint . --max-warnings 10
      - run: pnpm format:check
      - run: pnpm check

  migration-check:
    name: Migration Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-migrations.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # C5-2026-08：unit-tests 改为带覆盖率的门禁检查（此前仅跑测试不收集覆盖率，门禁形同虚设）。
      # 阈值以 scripts/check-coverage.mjs 为权威源（当前 80/80/80/80）。
      - run: pnpm test:coverage:check

  critical-verify:
    name: CRITICAL Fix Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Run static verification scripts
        run: pnpm verify:critical --skip-db --skip-frontend
      - name: Run Zod coverage verification
        run: pnpm verify:high

  deadcode:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm deadcode

  loc-stats:
    name: Line Count Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scc
        run: |
          curl -sL https://github.com/boyter/scc/releases/latest/download/scc-3.7.0-x86_64-unknown-linux.zip -o scc.zip
          unzip -q scc.zip -d /tmp/scc
          echo "/tmp/scc" >> $GITHUB_PATH
      - name: Count lines
        run: scc --exclude-dir node_modules,dist,dist-ssr,.dev-logs,coverage,.git,data,report,.nyc_output,.turbo,.cache,.vite,playwright-report,test-results --no-cocomo --sort lines

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm test:contract
