# CI/CD 工作流（附录 C：验证脚本 + CRITICAL 回归门控）
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.3'
  DATABASE_URL: postgresql://backtest_app:backtest_app_dev@localhost:15442/backtest_test
  REDIS_URL: redis://localhost:16381

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # job 级覆盖 workflow 级；缺此项 checkout 会 403
      security-events: write # gitleaks-action 上传 SARIF 到 Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # job 级覆盖 workflow 级；缺此项 checkout 会 403
      security-events: write # SARIF 上传到 GitHub Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # 固定 commit SHA（CVE-2026-33634 供应链事件后 trivy-action 禁用可变 tag）
      - name: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,dist,dist-ssr,coverage,.git,.dev-logs,data,report,test-results,.turbo
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          # 使 CRITICAL/HIGH 漏洞成为门禁失败，而非仅 SARIF 注解
          exit-code: 1
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        if: always()
        with:
          sarif_file: trivy-results.sarif

  lint-and-typecheck:
    name: Lint + TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # 阈值 3：与 lint-staged 一致（当前 0 违规），防本地过 CI 挂
      - run: pnpm exec eslint . --max-warnings 3
      - run: pnpm format:check
      - run: pnpm check
      # 测试套件类型门禁：tests/**（unit/integration/contract/property/chaos/helpers/mocks）全量 tsc
      - run: pnpm check:tests
      # 层间依赖纪律门禁（C-024）：只 gate 分层规则，no-circular 配置为 warn 仅记录
      # 注意：verify-depcruise 经 run-all 在 critical-verify job 统一执行（C-015 门禁），此处不重复
      # 重复代码门禁（jscpd --threshold 5）：与 DADR-052 依赖/健康门禁配套
      - run: pnpm run simplify
      # i18n 键完整性门禁：防止收敛误删仍被引用的键（历史回归：e8a0d805 / 83f9be11）
      - run: pnpm run audit:i18n
      # 供应链门禁：prod 依赖 CRITICAL/HIGH 漏洞阻断，moderate/low 仅告警（scripts/audit-supply.mjs）
      - run: pnpm run audit:supply

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # 生产构建门禁（turbo build = vite build + backend tsc emit），
      # 与 Dockerfile.frontend/backend 构建命令一致；k8s 引用 frontend:v1.0.0 需此镜像可构建。
      - run: pnpm build

  migration-check:
    name: Migration Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-migrations.mjs

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_TESTCONTAINERS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # TS 测试唯一门禁：unit/contract/integration/property 带覆盖率检查，RUN_TESTCONTAINERS=1 使 testcontainers 集成测试在 CI 实际执行。
      # chaos/e2e 仅 nightly（nightly.yml）；阈值以 scripts/check-coverage.mjs 为权威源（80/80/80/80）。
      - run: pnpm test:coverage:check

  # page-smoke a11y 门禁（AGENTS §5）：本地 --repeat-each=10 全绿后才挂入；
  # CI 用 repeat-each=3 控时长。稳定性门槛证据见会话收口 @2a5d011f 系列。
  page-smoke:
    name: Page Smoke (a11y gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: backtest_app
          POSTGRES_PASSWORD: backtest_app_dev
          POSTGRES_DB: backtest_test
        ports:
          - '15442:5432'
        options: >-
          --health-cmd "pg_isready -U backtest_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - '16381:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm build:frontend
      - run: pnpm --filter @backtest/backend migrate
      - run: npx playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/ui/page-smoke.spec.ts --project=chromium --repeat-each=3 --reporter=line
      - run: pnpm exec playwright test tests/e2e/ui/backtest.spec.ts --project=chromium --reporter=line
      - run: pnpm exec playwright test tests/e2e/ui/fuzz-random.spec.ts --project=chromium --reporter=line

  critical-verify:
    name: CRITICAL Fix Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # golden 门禁（R-04）需要 origin/master 对比历史；fetch-depth:0 仅多拉取提交对象
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      # golden 门禁（R-04）：statistics_golden.json 变更的 PR，提交标题必须带 [golden] 标记（授权重基线可追溯）
      - name: Enforce golden re-baseline marker (R-04)
        run: |
          changed=$(git diff --name-only origin/master...HEAD -- engine-go/testdata/statistics_golden.json)
          if [ -n "$changed" ]; then
            echo "statistics_golden.json changed in this PR — [golden] marker required in commit titles"
            subjects=$(git log --format=%s origin/master..HEAD)
            echo "$subjects"
            if ! echo "$subjects" | grep -q '\[golden\]'; then
              echo "::error::statistics_golden.json 变更但 origin/master..HEAD 提交标题均不含 [golden] 标记（R-04 重基线授权纪律）"
              exit 1
            fi
          else
            echo "statistics_golden.json 未变更 — 跳过"
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
            packages/go-shared/go.sum
      # 静态验证门禁（verify-static 不依赖 DB/前端，纯静态执行）：
      # C-015 ADR 一致性 / C-016 CHANGELOG / C-017 迁移 / C-019 前端死代码等
      # 注意：verify:critical 同时内含 C-014 —— engine-go 的 `go test -race` + 覆盖率门禁，
      # 故 Go 单测在本 job 执行，勿误以为 PR CI 不含 Go 测试
      - name: Run static verification scripts
        run: pnpm verify:critical
      # Go 官方漏洞扫描：基于调用图只报实际受影响漏洞；版本固定（@v1.7.0）符合供应链固定纪律
      - name: govulncheck (engine-go)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: engine-go
      - name: govulncheck (data-fetcher)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: data-fetcher
      - name: govulncheck (go-shared)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: packages/go-shared

  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            engine-go/go.sum
            data-fetcher/go.sum
            packages/go-shared/go.sum
      - name: golangci-lint (engine-go)
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.12.2
          working-directory: engine-go
          args: --config=../.golangci.yml
      - name: golangci-lint (data-fetcher)
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.12.2
          working-directory: data-fetcher
          args: --config=../.golangci.yml
      - name: golangci-lint (go-shared)
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.12.2
          working-directory: packages/go-shared
          args: --config=../../.golangci.yml

  deadcode:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm deadcode

  # 应用镜像在 PR 期即构建，Dockerfile 错误无需等 nightly docker-security-scan
  docker-build:
    name: Docker Build (app images)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker compose build api frontend worker engine-go data-fetcher
