name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push all images
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          for spec in api:Dockerfile.backend data-fetcher:data-fetcher/Dockerfile engine-go:engine-go/Dockerfile worker:docker/worker/Dockerfile frontend:Dockerfile.frontend; do
            name="${spec%%:*}"; df="${spec#*:}"
            docker build -f "$df" -t "$REPO/$name:$TAG" --push .
          done

  release-notes:
    name: GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
