name: SDK Generation

on:
  push:
    paths:
      - 'packages/backend/src/schemas/openapi-registry.ts'
      - 'packages/api-client/**'
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate-and-test:
    name: SDK Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/pnpm-setup
        with:
          node-version: lts/*

      - name: Type check
        run: npx tsc --noEmit -p packages/api-client/tsconfig.json

      - name: Test
        run: pnpm --filter @backtest/api-client test

      - name: Build
        run: pnpm --filter @backtest/api-client build

      - name: Validate npm pack
        run: cd packages/api-client && npm pack --dry-run
