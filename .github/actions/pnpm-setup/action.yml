name: Setup pnpm + Node
description: Install pnpm and Node.js (pnpm cache), then install dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: true
  pnpm-version:
    description: pnpm version to install (falls back to packageManager field)
    required: false

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
      shell: bash
